<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Requests</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Access Requests</h1>
        <p>Submit and review temp-access and stock-adjustment tickets.</p>
    </div>

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="300"

            api="http://127.0.0.1:8080/accessRequestHeaderApi"

            table-id="accessRequestHeaderTable"

            caption="Access Requests"

            classes="blue neon pastel dark"

            extra-buttons="Approve:/approveAccessRequestApi, Deny:/denyAccessRequestApi"

            inputs="
                |name::request_type_code|title::Type|type::data-combo|value::|api::http://127.0.0.1:8080/accessRequestTypeLookupApi;;
                |name::request_status_code|title::Status|type::data-combo|value::|api::http://127.0.0.1:8080/accessRequestUserStatusLookupApi;;
                |name::requester_user_code|title::Requester|type::current-user|value::;;
                |name::target_inventory_id|title::Target Inventory|type::find-object-box|value::|api::http://127.0.0.1:8080/inventoryPickerApi|columns::Type,Warehouse;;
                |name::reason|title::Reason|type::text|value::;;
                |name::expires_at|title::Expires At|type::date-box|value::;;
            "

            columns="
                Type,
                Status,
                Requester,
                Reason,
                Requested At
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
