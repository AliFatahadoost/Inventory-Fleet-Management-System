<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Fleet Trip Manager</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-body: #eef2f7; --bg-card: #ffffff; --bg-input: #f8fafc;
            --bg-table-header: #f1f5f9; --bg-table-row-even: #fafbfc; --bg-table-row-hover: #eef2ff;
            --text-primary: #1e293b; --text-secondary: #475569; --text-muted: #94a3b8;
            --border: #dde4ef; --shadow: 0 4px 24px rgba(0,0,0,0.05);
            --accent: #4a6fa5; --radius: 10px; --transition: 0.2s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --bg-scrollbar: #c8d2e0; --bg-scrollbar-track: #f1f5f9;
        }
        body.dark-mode {
            --bg-body: #171a21; --bg-card: #1e2128; --bg-input: #252830;
            --bg-table-header: #252830; --bg-table-row-even: #1f2229; --bg-table-row-hover: #282d38;
            --text-primary: #e2e6ec; --text-secondary: #b0b8c4; --text-muted: #6b7280;
            --border: #2e333d; --shadow: 0 4px 24px rgba(0,0,0,0.25);
            --bg-scrollbar: #3a404d; --bg-scrollbar-track: #1e2128;
        }
        * { box-sizing: border-box; font-family: var(--font); margin: 0; padding: 0; }
        body {
            background: var(--bg-body); color: var(--text-primary); display: flex;
            justify-content: center; padding: 24px; min-height: 100vh;
            transition: background var(--transition), color var(--transition);
        }
        .container { width: 100%; max-width: 1400px; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }
        .card {
            background: var(--bg-card); border: 2px solid var(--border);
            border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .two-col { display: flex; gap: 20px; flex-wrap: wrap; }
        .left { flex: 1.6; min-width: 500px; }
        .right { flex: 1; min-width: 350px; display: flex; flex-direction: column; gap: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: var(--bg-table-header); color: var(--text-secondary); font-weight: 600; }
        tbody tr:nth-child(even) { background: var(--bg-table-row-even); }
        tbody tr:hover { background: var(--bg-table-row-hover); }
        .driver-group { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
        .driver-header {
            background: var(--bg-table-header); padding: 10px 14px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); transition: background var(--transition);
        }
        .driver-header:hover { background: var(--bg-table-row-hover); }
        .driver-requests { display: none; padding: 8px 14px; }
        .driver-requests.open { display: block; }
        .request-table { width: 100%; margin: 0; font-size: 0.82rem; }
        .request-table th { background: transparent; border-bottom: 2px solid var(--border); }
        .checkbox-cell { width: 30px; text-align: center; }
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .map-container { height: 300px; border-radius: var(--radius); border: 2px solid var(--border); z-index: 1; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        .form-group label { font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px; }
        .form-group select { width: 100%; padding: 8px; border: 2px solid var(--border); border-radius: 6px; background: var(--bg-input); color: var(--text-primary); font-size: 0.9rem; }
        .btn {
            padding: 8px 20px; border: none; border-radius: 8px; font-weight: 700;
            font-size: 0.85rem; cursor: pointer; transition: all var(--transition);
            background: var(--accent); color: #fff;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        .info-msg {
            font-size: 0.85rem;
            color: var(--accent);
            background: var(--bg-table-row-hover);
            padding: 6px 12px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }
        .toast {
            position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff;
            padding: 12px 24px; border-radius: 8px; font-weight: 600; z-index: 9999;
            opacity: 0; transform: translateY(20px); transition: all 0.3s ease; pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        body.dark-mode .toast { background: #f8fafc; color: #1e293b; }
        @media (max-width: 800px) {
            .two-col { flex-direction: column; }
            .left, .right { min-width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚛 Fleet Trip Manager</h1>
    <div class="two-col">
        <div class="left">
            <div class="card">
                <h2 style="margin-bottom:12px;">👤 Drivers with Assigned Requests</h2>
                <div id="driversContainer">⏳ Loading drivers...</div>
            </div>
            <div class="card">
                <h2 style="margin-bottom:12px;">📦 Active Trips (In Progress)</h2>
                <div id="activeTripsContainer">⏳ Loading active trips...</div>
            </div>
        </div>
        <div class="right">
            <div class="card">
                <div id="map" class="map-container"></div>
                <div style="margin-top:12px; font-size:0.9rem; display:flex; gap:20px;">
                    <span id="distText">📏 Distance: --</span>
                    <span id="timeText">⏱️ Est. Time: --</span>
                </div>
            </div>
            <div class="card">
                <div class="controls">
                    <div class="form-group">
                        <label for="vehicleSelect">🚛 Vehicle *</label>
                        <select id="vehicleSelect">
                            <option value="">-- Select Vehicle --</option>
                        </select>
                    </div>
                    <button class="btn" id="startTripBtn" disabled>▶ Start Trip</button>
                    <div class="info-msg" id="tripInfoMsg"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async () => {
    // Theme sync
    function syncTheme() {
        try {
            const pb = parent.document.querySelector('body');
            document.body.classList.toggle('dark-mode', pb && pb.classList.contains('dark-mode'));
        } catch(e) {}
    }
    syncTheme();
    try {
        const pb = parent.document.querySelector('body');
        if(pb) new MutationObserver(syncTheme).observe(pb, {attributes: true, attributeFilter: ['class']});
    } catch(e) {}

    const $ = id => document.getElementById(id);
    const API = window.location.origin;
    const toast = $('toast');
    const showToast = (msg) => {
        toast.textContent = msg; toast.classList.add('show');
        clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
    };

    // API helpers
    async function fetchJSON(url) {
        const res = await fetch(API + url, { method: 'POST', credentials: 'include' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    }
    async function callAPI(url, body) {
        const res = await fetch(API + url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    }

    // OSRM
    async function getOSRMRoute(coordsArray) {
        const lngLats = coordsArray.map(c => `${c[1]},${c[0]}`).join(';');
        const url = `https://router.project-osrm.org/route/v1/driving/${lngLats}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('OSRM request failed');
        const data = await res.json();
        if (data.routes?.[0]) return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        throw new Error('No route');
    }

    function haversine(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Data
    let driverRequests = [], activeTrips = [], locations = [], vehicles = [], products = [];
    let map, markers = [], routeLine = null;

    async function loadData() {
        try {
            const [drData, tripsData, locData, vehData, prodData] = await Promise.all([
                fetchJSON('/getDriverAndTheirRequestsAPI'),
                fetchJSON('/getActiveTripsAPI'),
                fetchJSON('/inventoryLocationsReadableAPI'),
                fetchJSON('/getVehicleAPI'),
                fetchJSON('/productsWithCategoryAPI')
            ]);
            driverRequests = Array.isArray(drData) ? drData : [];
            activeTrips = Array.isArray(tripsData) ? tripsData : [];
            locations = Array.isArray(locData) ? locData : [];
            vehicles = (Array.isArray(vehData) ? vehData : []).filter(v => v.IS_DELETED != 1);
            products = Array.isArray(prodData) ? prodData : [];

            populateVehicleDropdown();
            buildDriversAccordion();
            renderActiveTrips();
        } catch(e) {
            console.error(e);
            showToast('❌ Failed to load data.');
        }
    }

    function populateVehicleDropdown() {
        const sel = $('vehicleSelect');
        sel.innerHTML = '<option value="">-- Select Vehicle --</option>';
        vehicles.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.VEHICLE_ID;
            opt.textContent = `${v.VEHICLE_NAME} (${v.VEHICLE_LICENCE_PLATE})`;
            sel.appendChild(opt);
        });
        sel.addEventListener('change', validateTripButton);
    }

    function getLocationName(id) {
        const loc = locations.find(l => l.INVENTORY_LOCATION_ID == id);
        return loc ? loc.INVENTORY_LOCATION_NAME : `#${id}`;
    }

    function getProductName(id) {
        const prod = products.find(p => p.PRODUCTS_ID == id);
        return prod ? prod.PRODUCTS_NAME : `Product #${id}`;
    }

    function getVehicleName(id) {
        const veh = vehicles.find(v => v.VEHICLE_ID == id);
        return veh ? `${veh.VEHICLE_NAME} (${veh.VEHICLE_LICENCE_PLATE})` : `Vehicle #${id}`;
    }

    function buildDriversAccordion() {
        const container = $('driversContainer');
        if (!driverRequests.length) {
            container.innerHTML = '<p style="text-align:center;padding:20px;">No drivers with assigned requests found.</p>';
            return;
        }
        const groups = {};
        driverRequests.forEach(r => {
            const dId = r.DRIVER_ID;
            if (!groups[dId]) groups[dId] = { driver: null, requests: [] };
            groups[dId].requests.push(r);
            if (!groups[dId].driver) {
                groups[dId].driver = {
                    DRIVER_ID: r.DRIVER_ID,
                    DRIVER_NAME: r.DRIVER_NAME,
                    DRIVER_LAST_NAME: r.DRIVER_LAST_NAME,
                    DRIVERS_NATIONAL_CODE: r.DRIVERS_NATIONAL_CODE
                };
            }
        });
        const driversList = Object.values(groups);
        let html = '';
        driversList.forEach(g => {
            const driver = g.driver;
            const driverName = (driver.DRIVER_NAME + ' ' + (driver.DRIVER_LAST_NAME || '')).trim();
            const count = g.requests.length;
            html += `
            <div class="driver-group">
                <div class="driver-header" data-driver-id="${driver.DRIVER_ID}">
                    <strong>${esc(driverName)}</strong>
                    <span style="color:var(--text-muted); font-size:0.8rem;">${count} request(s)</span>
                </div>
                <div class="driver-requests" id="driver-reqs-${driver.DRIVER_ID}">
                    <table class="request-table">
                        <thead>
                            <tr>
                                <th class="checkbox-cell"><input type="checkbox" class="driver-select-all" data-driver="${driver.DRIVER_ID}" title="Select all"></th>
                                <th>ID</th>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>From</th>
                                <th>To</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${g.requests.map(r => {
                                const fromName = getLocationName(r.FROM_INVENTORY_ID);
                                const toName = getLocationName(r.INVENTORY_ID);
                                const prodName = r.PRODUCTS_NAME || r.PRODUCT_NAME || getProductName(r.PRODUCTS_ID) || 'Unknown';
                                return `
                                <tr>
                                    <td class="checkbox-cell"><input type="checkbox" class="req-checkbox" data-id="${r.INVENTORY_STOCK_REQUEST_ID}" data-driver="${r.DRIVER_ID}" data-from="${r.FROM_INVENTORY_ID}" data-to="${r.INVENTORY_ID}"></td>
                                    <td>${r.INVENTORY_STOCK_REQUEST_ID}</td>
                                    <td>${esc(prodName)}</td>
                                    <td>${r.PRODUCTS_COUNT}</td>
                                    <td>${esc(fromName)}</td>
                                    <td>${esc(toName)}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        });
        container.innerHTML = html;

        // Expand/collapse
        container.querySelectorAll('.driver-header').forEach(header => {
            header.addEventListener('click', function(e) {
                const driverId = this.dataset.driverId;
                const reqDiv = document.getElementById('driver-reqs-' + driverId);
                const isHidden = reqDiv.style.display === 'none' || reqDiv.style.display === '';
                reqDiv.style.display = isHidden ? 'block' : 'none';
                reqDiv.classList.toggle('open', isHidden);
                this.parentNode.classList.toggle('expanded', isHidden);
            });
        });

        // Select all per driver
        container.querySelectorAll('.driver-select-all').forEach(cb => {
            cb.addEventListener('change', function(e) {
                const driverId = this.dataset.driver;
                document.querySelectorAll(`.req-checkbox[data-driver="${driverId}"]`).forEach(c => c.checked = this.checked);
                updateMapAndButton();
            });
        });

        // Individual checkboxes
        container.querySelectorAll('.req-checkbox').forEach(cb => cb.addEventListener('change', updateMapAndButton));
    }

    function renderActiveTrips() {
        const container = $('activeTripsContainer');
        if (!activeTrips.length) {
            container.innerHTML = '<p style="text-align:center;padding:20px;">No active trips.</p>';
            return;
        }
        container.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Movement ID</th>
                        <th>Vehicle</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Started</th>
                        <th>Product</th>
                        <th>Qty</th>
                    </tr>
                </thead>
                <tbody>
                    ${activeTrips.map(trip => `
                        <tr>
                            <td>${trip.PRODUCTS_MOVEMENTS_ID}</td>
                            <td>${esc(getVehicleName(trip.VEHICLE_ID))}</td>
                            <td>${esc(getLocationName(trip.COMES_FROM_LOCATION_ID))}</td>
                            <td>${esc(getLocationName(trip.GOES_TO_LOCATION_ID))}</td>
                            <td>${trip.START_DATE_HOUR}</td>
                            <td>${esc(getProductName(trip.PRODUCTS_ID))}</td>
                            <td>${trip.PRODUCTS_COUNT || 0}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function getSelectedRequests() {
        const cbs = document.querySelectorAll('.req-checkbox:checked');
        return Array.from(cbs).map(c => ({
            id: parseInt(c.dataset.id),
            driver: parseInt(c.dataset.driver),
            from: parseInt(c.dataset.from),
            to: parseInt(c.dataset.to)
        }));
    }

    function validateTripButton() {
        const selected = getSelectedRequests();
        const vehicleId = $('vehicleSelect').value;
        const btn = $('startTripBtn');
        const msgDiv = $('tripInfoMsg');
        let valid = false;
        let reason = '';

        if (selected.length === 0) {
            reason = 'Select at least one request.';
        } else if (!vehicleId) {
            reason = 'Choose a vehicle.';
        } else {
            const first = selected[0];
            const sameDriver = selected.every(s => s.driver === first.driver);
            const sameOrigin = selected.every(s => s.from === first.from);
            if (!sameDriver) {
                reason = 'All selected requests must have the same driver.';
            } else if (!sameOrigin) {
                reason = 'All selected requests must have the same origin (from inventory).';
            } else {
                valid = true;
                const sameDest = selected.every(s => s.to === first.to);
                if (!sameDest) {
                    reason = '⚠️ Destinations differ. The stored procedure may require identical destinations. Proceed at your own risk.';
                }
            }
        }

        btn.disabled = !valid;
        msgDiv.style.display = valid ? (reason ? 'block' : 'none') : 'block';
        msgDiv.textContent = reason ? reason : '';
    }

    function initMap() {
        if (map) return;
        map = L.map('map').setView([35.7, 51.4], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
    }

    function clearMap() {
        markers.forEach(m => map.removeLayer(m)); markers = [];
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    }

    async function updateMap() {
        initMap();
        clearMap();
        const selected = getSelectedRequests();
        if (!selected.length) {
            $('distText').textContent = '📏 Distance: --';
            $('timeText').textContent = '⏱️ Est. Time: --';
            return;
        }

        const first = selected[0];
        const fromLoc = locations.find(l => l.INVENTORY_LOCATION_ID == first.from);
        if (!fromLoc) return;
        const originCoords = [parseFloat(fromLoc.INVENTORY_LOCATION_LAT), parseFloat(fromLoc.INVENTORY_LOCATION_LONG)];

        const dests = selected.map(s => {
            const toLoc = locations.find(l => l.INVENTORY_LOCATION_ID == s.to);
            return toLoc ? [parseFloat(toLoc.INVENTORY_LOCATION_LAT), parseFloat(toLoc.INVENTORY_LOCATION_LONG)] : null;
        }).filter(Boolean);

        if (dests.length === 0) return;

        const waypoints = [originCoords, ...dests];

        markers.push(L.marker(originCoords).addTo(map).bindPopup(`Origin: ${fromLoc.INVENTORY_LOCATION_NAME}`));
        const uniqueDests = [];
        dests.forEach((coords) => {
            const [lat, lng] = coords;
            if (!uniqueDests.some(d => d[0]===lat && d[1]===lng)) {
                uniqueDests.push(coords);
                const toLoc = locations.find(l => parseFloat(l.INVENTORY_LOCATION_LAT) === lat && parseFloat(l.INVENTORY_LOCATION_LONG) === lng);
                markers.push(L.marker(coords).addTo(map).bindPopup(`Destination: ${toLoc ? toLoc.INVENTORY_LOCATION_NAME : `${lat},${lng}`}`));
            }
        });

        try {
            const routeCoords = await getOSRMRoute(waypoints);
            routeLine = L.polyline(routeCoords, { color: '#f43f5e', weight: 4 }).addTo(map);
            map.fitBounds(routeCoords);
        } catch(e) {
            routeLine = L.polyline(waypoints, { color: '#f43f5e', weight: 4, dashArray: '10,10' }).addTo(map);
            map.fitBounds(waypoints);
        }

        let totalDist = 0;
        for (let i = 1; i < waypoints.length; i++) {
            totalDist += haversine(waypoints[i-1][0], waypoints[i-1][1], waypoints[i][0], waypoints[i][1]);
        }
        $('distText').textContent = `📏 Distance: ${totalDist.toFixed(1)} km`;
        $('timeText').textContent = `⏱️ Est. Time: ${(totalDist/60).toFixed(1)} h`;
    }

    function updateMapAndButton() {
        validateTripButton();
        updateMap();
    }

    $('startTripBtn').addEventListener('click', async () => {
        const selected = getSelectedRequests();
        const vehicleId = parseInt($('vehicleSelect').value);
        if (!selected.length || isNaN(vehicleId)) {
            showToast('❌ Please select requests and a vehicle.');
            return;
        }
        const idStr = selected.map(s => s.id).join('|');
        const payload = [{ p1: idStr, p2: vehicleId }];
        try {
            await callAPI('/createMovementFromStockRequestAPI', payload);
            showToast('✅ Trip started successfully!');
        } catch(e) {
            console.error(e);
            showToast('❌ Failed to start trip.');
        } finally {
            await loadData();
            clearMap();
        }
    });

    window.addEventListener('load', () => {
        initMap();
        loadData();
    });

    function esc(s) {
        const div = document.createElement('div');
        div.textContent = s || '';
        return div.innerHTML;
    }
})();
</script>
</body>
</html>
