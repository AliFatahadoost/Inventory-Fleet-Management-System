<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Task Management</title>
    <style>
        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-table-header: #f1f5f9;
            --bg-table-row-even: #fafbfc;
            --bg-table-row-hover: #eef2ff;
            --bg-pill-active: #4a6fa5;
            --bg-button: #4a6fa5;
            --bg-button-hover: #3b5998;
            --bg-danger: #f43f5e;
            --bg-danger-hover: #e11d48;
            --bg-search: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-button: #ffffff;
            --border: #dde4ef;
            --shadow: 0 4px 24px rgba(0,0,0,0.05);
            --radius: 10px;
            --transition: 0.2s ease;
            --font: 'Segoe UI', system-ui, sans-serif;
            --bg-scrollbar: #c8d2e0;
            --bg-scrollbar-track: #f1f5f9;
        }
        body.dark-mode {
            --bg-body: #171a21;
            --bg-card: #1e2128;
            --bg-input: #252830;
            --bg-table-header: #252830;
            --bg-table-row-even: #1f2229;
            --bg-table-row-hover: #282d38;
            --bg-pill-active: #5a8fc7;
            --bg-button: #5a8fc7;
            --bg-button-hover: #4a7db5;
            --bg-danger: #f43f5e;
            --bg-danger-hover: #e11d48;
            --bg-search: #252830;
            --text-primary: #e2e6ec;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --text-button: #ffffff;
            --border: #2e333d;
            --shadow: 0 4px 24px rgba(0,0,0,0.25);
            --bg-scrollbar: #3a404d;
            --bg-scrollbar-track: #1e2128;
        }
        * { box-sizing: border-box; font-family: var(--font); margin: 0; padding: 0; }
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        .container { width: 100%; max-width: 1200px; }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }
        .card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 140px;
            flex: 1 1 180px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            padding: 8px 10px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border var(--transition);
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--bg-pill-active); }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-button);
            color: var(--text-button);
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-button-hover); transform: translateY(-1px); }
        .btn.danger { background: var(--bg-danger); }
        .btn.danger:hover { background: var(--bg-danger-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 0.85rem;
        }
        th { background: var(--bg-table-header); color: var(--text-secondary); font-weight: 600; }
        tbody tr:nth-child(even) { background: var(--bg-table-row-even); }
        tbody tr:hover { background: var(--bg-table-row-hover); }
        .actions { display: flex; gap: 6px; }
        .empty { text-align: center; padding: 30px; color: var(--text-muted); }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        body.dark-mode .toast { background: #f8fafc; color: #1e293b; }
        @media (max-width: 700px) {
            .form-row { flex-direction: column; }
            .form-group { flex: 1 1 auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Task Management</h1>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin:0;">➕ Create / Update Task</h3>
            <button class="btn" id="clearFormBtn">🗑️ Clear Form</button>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="taskName">Task Name *</label>
                <input type="text" id="taskName" placeholder="e.g., Inventory Count" required />
            </div>
            <div class="form-group">
                <label for="taskDesc">Description *</label>
                <input type="text" id="taskDesc" placeholder="Brief description" required />
            </div>
            <div class="form-group">
                <label for="roleSelect">Role *</label>
                <select id="roleSelect" required>
                    <option value="">-- Select a role --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="estHours">Est. Hours</label>
                <input type="number" step="0.01" id="estHours" placeholder="e.g., 2.5" />
            </div>
            <div class="form-group">
                <label for="hourlyRate">Hourly Rate</label>
                <input type="number" step="0.01" id="hourlyRate" placeholder="e.g., 15.00" />
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn" id="createBtn">💾 Create Task</button>
            <button class="btn" id="updateBtn" disabled>✏️ Update Selected</button>
            <span id="selectedTaskId" style="color:var(--text-muted); font-size:0.85rem;"></span>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom:12px;">📄 Existing Tasks</h3>
        <div id="tableContainer">
            <div class="empty">⏳ Loading tasks...</div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(async function() {
    // Theme sync
    function syncTheme() {
        try {
            const pb = parent.document.querySelector('body');
            document.body.classList.toggle('dark-mode', pb && pb.classList.contains('dark-mode'));
        } catch(e) {}
    }
    syncTheme();
    try {
        const pb = parent.document.querySelector('body');
        if(pb) new MutationObserver(syncTheme).observe(pb, {attributes:true, attributeFilter:['class']});
    } catch(e) {}

    const $ = id => document.getElementById(id);
    const API = window.location.origin;
    const toast = $('toast');
    function showToast(msg, ms=3000) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), ms);
    }

    let tasks = [];
    let roles = [];
    let selectedTask = null;
    let currentUserId = 0;

    const taskNameEl = $('taskName'), taskDescEl = $('taskDesc');
    const roleSelect = $('roleSelect');
    const estHoursEl = $('estHours'), hourlyRateEl = $('hourlyRate');
    const createBtn = $('createBtn'), updateBtn = $('updateBtn');
    const selectedIdSpan = $('selectedTaskId'), clearFormBtn = $('clearFormBtn');
    const tableContainer = $('tableContainer');

    async function postRequest(endpoint, body) {
        const res = await fetch(API + endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify(body)
        });
        if (!res.ok) {
            let detail = '';
            try { const t = await res.text(); detail = ': ' + t; } catch(e) {}
            throw new Error(`HTTP ${res.status}${detail}`);
        }
        return true;
    }

    async function getCurrentUserId() {
        try {
            const res = await fetch(API + '/getUserIdAPI', { method:'POST', credentials:'include' });
            if (res.ok) {
                const data = await res.json();
                const id = data?.[0]?.SYS_USER_ID;
                if (id) return parseInt(id);
            }
        } catch(e) { console.error(e); }
        return 0;
    }

    async function loadRoles() {
        try {
            const res = await fetch(API + '/roleListAPI', { method:'POST', credentials:'include' });
            if (res.ok) {
                const data = await res.json();
                console.log('Roles data:', data);          // DEBUG
                roles = Array.isArray(data) ? data : [];
                roleSelect.innerHTML = '<option value="">-- Select a role --</option>';
                roles.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r.ROLE_CODE;            // string
                    option.textContent = r.ROLES_TITLE;
                    roleSelect.appendChild(option);
                });
            }
        } catch(e) {
            console.error(e);
            showToast('⚠️ Could not load roles.');
        }
    }

    async function loadTasks() {
        try {
            const res = await fetch(API + '/tasksReportAPI', { method:'POST', credentials:'include' });
            if (res.ok) {
                const data = await res.json();
                console.log('Tasks data:', data);           // DEBUG
                tasks = Array.isArray(data) ? data : [];
                renderTable();
            } else {
                tableContainer.innerHTML = '<div class="empty">❌ Failed to load tasks</div>';
            }
        } catch(e) {
            console.error(e);
            tableContainer.innerHTML = '<div class="empty">❌ Failed to load tasks</div>';
        }
    }

    // Helper: get the numeric role ID from a task object regardless of column name
    function getRoleId(task) {
        // Try common column names
        if (task.TASK_FOR_ROLE_ID !== undefined) return Number(task.TASK_FOR_ROLE_ID);
        if (task.ROLE_ID !== undefined) return Number(task.ROLE_ID);
        if (task.ROLE_CODE !== undefined) return Number(task.ROLE_CODE);
        // Fallback: scan all keys for something ending with "ROLE_ID"
        for (const key in task) {
            if (key.endsWith('ROLE_ID')) return Number(task[key]);
        }
        return NaN;
    }

    // Helper: get a readable role title from a role code
    function getRoleTitle(code) {
        const role = roles.find(r => Number(r.ROLE_CODE) === Number(code));
        return role ? role.ROLES_TITLE : (code || '—');
    }

    function renderTable() {
        if (tasks.length === 0) {
            tableContainer.innerHTML = '<div class="empty">📭 No tasks found</div>';
            return;
        }
        const html = `
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Description</th><th>Role</th><th>Est. Hrs</th><th>Rate</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${tasks.map(t => {
                        const roleId = getRoleId(t);
                        const roleDisplay = isNaN(roleId) ? '—' : getRoleTitle(roleId);
                        return `
                        <tr class="${selectedTask && selectedTask.TASKS_ID === t.TASKS_ID ? 'selected-row' : ''}">
                            <td>${t.TASKS_ID}</td>
                            <td>${escapeHtml(t.TASK_NAME)}</td>
                            <td>${escapeHtml(t.TASK_DESCRIPTION)}</td>
                            <td>${roleDisplay}</td>
                            <td>${t.EST_HOURS_IT_WILL_TAKE}</td>
                            <td>${t.HOURLY_RATE_FOR_TASK}</td>
                            <td class="actions">
                                <button class="btn btn-sm edit-btn" data-id="${t.TASKS_ID}">✏️ Edit</button>
                                <button class="btn btn-sm danger delete-btn" data-id="${t.TASKS_ID}">🗑️ Delete</button>
                            </td>
                        </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        tableContainer.innerHTML = html;

        tableContainer.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => editTask(parseInt(btn.dataset.id)));
        });
        tableContainer.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteTask(parseInt(btn.dataset.id)));
        });
    }

    function editTask(id) {
        const task = tasks.find(t => t.TASKS_ID === id);
        if (!task) return;
        selectedTask = task;
        taskNameEl.value = task.TASK_NAME || '';
        taskDescEl.value = task.TASK_DESCRIPTION || '';
        // Set dropdown to the correct role (convert role ID to string)
        const roleId = getRoleId(task);
        roleSelect.value = isNaN(roleId) ? '' : String(roleId);
        estHoursEl.value = task.EST_HOURS_IT_WILL_TAKE || '';
        hourlyRateEl.value = task.HOURLY_RATE_FOR_TASK || '';
        selectedIdSpan.textContent = `Selected: ID ${task.TASKS_ID}`;
        updateBtn.disabled = false;
        createBtn.disabled = true;
        renderTable();
    }

    function clearForm() {
        taskNameEl.value = '';
        taskDescEl.value = '';
        roleSelect.value = '';
        estHoursEl.value = '';
        hourlyRateEl.value = '';
        selectedTask = null;
        selectedIdSpan.textContent = '';
        updateBtn.disabled = true;
        createBtn.disabled = false;
        renderTable();
    }

    async function createTask() {
        const name = taskNameEl.value.trim();
        const desc = taskDescEl.value.trim();
        const roleCode = roleSelect.value;   // string
        const est = estHoursEl.value.trim() || '0';
        const rate = hourlyRateEl.value.trim() || '0';
        if (!name || !desc || !roleCode) {
            showToast('❌ Name, Description, and Role are required.');
            return;
        }
        const payload = [{
            p1: 'CREATE_TASK',
            p2: currentUserId,
            p3: 0,
            p4: name,
            p5: desc,
            p6: parseInt(roleCode),
            p7: parseFloat(est),
            p8: parseFloat(rate)
        }];
        try {
            await postRequest('/createUpdateDeleteTaskAPI', payload);
            showToast('✅ Task created.');
            clearForm();
            await loadTasks();
        } catch(e) {
            console.error(e);
            showToast('❌ Failed to create task.');
        }
    }

    async function updateTask() {
        if (!selectedTask) return;
        const name = taskNameEl.value.trim();
        const desc = taskDescEl.value.trim();
        const roleCode = roleSelect.value;
        const est = estHoursEl.value.trim() || '0';
        const rate = hourlyRateEl.value.trim() || '0';
        if (!name || !desc || !roleCode) {
            showToast('❌ Name, Description, and Role are required.');
            return;
        }
        const payload = [{
            p1: 'UPDATE_TASK',
            p2: currentUserId,
            p3: selectedTask.TASKS_ID,
            p4: name,
            p5: desc,
            p6: parseInt(roleCode),
            p7: parseFloat(est),
            p8: parseFloat(rate)
        }];
        try {
            await postRequest('/createUpdateDeleteTaskAPI', payload);
            showToast('✅ Task updated.');
            clearForm();
            await loadTasks();
        } catch(e) {
            console.error(e);
            showToast('❌ Failed to update task.');
        }
    }

    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;
        const payload = [{
            p1: 'DELETE_TASK',
            p2: currentUserId,
            p3: id,
            p4: '',
            p5: '',
            p6: 0,
            p7: 0,
            p8: 0
        }];
        try {
            await postRequest('/createUpdateDeleteTaskAPI', payload);
            showToast('🗑️ Task deleted.');
            if (selectedTask && selectedTask.TASKS_ID === id) clearForm();
            await loadTasks();
        } catch(e) {
            console.error(e);
            showToast('❌ Failed to delete task.');
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }

    createBtn.addEventListener('click', createTask);
    updateBtn.addEventListener('click', updateTask);
    clearFormBtn.addEventListener('click', clearForm);

    // Initialise
    currentUserId = await getCurrentUserId();
    await loadRoles();
    await loadTasks();
})();
</script>
</body>
</html>
