<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>User Salary Management</title>
    <style>
        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-table-header: #f1f5f9;
            --bg-table-row-even: #fafbfc;
            --bg-table-row-hover: #eef2ff;
            --bg-pill-active: #4a6fa5;
            --bg-button: #4a6fa5;
            --bg-button-hover: #3b5998;
            --bg-danger: #f43f5e;
            --bg-search: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-button: #ffffff;
            --border: #dde4ef;
            --shadow: 0 4px 24px rgba(0,0,0,0.05);
            --radius: 10px;
            --transition: 0.2s ease;
            --font: 'Segoe UI', system-ui, sans-serif;
            --bg-scrollbar: #c8d2e0;
            --bg-scrollbar-track: #f1f5f9;
        }
        body.dark-mode {
            --bg-body: #171a21;
            --bg-card: #1e2128;
            --bg-input: #252830;
            --bg-table-header: #252830;
            --bg-table-row-even: #1f2229;
            --bg-table-row-hover: #282d38;
            --bg-pill-active: #5a8fc7;
            --bg-button: #5a8fc7;
            --bg-button-hover: #4a7db5;
            --bg-danger: #f43f5e;
            --bg-search: #252830;
            --text-primary: #e2e6ec;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --text-button: #ffffff;
            --border: #2e333d;
            --shadow: 0 4px 24px rgba(0,0,0,0.25);
            --bg-scrollbar: #3a404d;
            --bg-scrollbar-track: #1e2128;
        }
        * { box-sizing: border-box; font-family: var(--font); margin: 0; padding: 0; }
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        .container { width: 100%; max-width: 1100px; }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }
        .card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-row input {
            flex: 1 1 200px;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--bg-search);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }
        .search-row input:focus { border-color: var(--bg-pill-active); }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-button);
            color: var(--text-button);
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-button-hover); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 0.85rem;
        }
        th { background: var(--bg-table-header); color: var(--text-secondary); font-weight: 600; }
        tbody tr:nth-child(even) { background: var(--bg-table-row-even); }
        tbody tr:hover { background: var(--bg-table-row-hover); }
        .salary-input {
            width: 100px;
            padding: 6px 8px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            text-align: right;
        }
        .salary-input:focus { border-color: var(--bg-pill-active); }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        body.dark-mode .toast { background: #f8fafc; color: #1e293b; }
        @media (max-width: 600px) {
            table { font-size: 0.75rem; }
            .salary-input { width: 70px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💰 User Base Salary Management</h1>
    <div class="card">
        <div class="search-row">
            <input type="text" id="userSearch" placeholder="Search by username..." />
            <button class="btn" id="clearSearch">✕ Clear</button>
        </div>
        <div id="tableContainer">
            <div style="text-align:center; padding:30px; color:var(--text-muted);">⏳ Loading users...</div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(async function() {
    // ── Theme sync ──
    function syncTheme() {
        try {
            const pb = parent.document.querySelector('body');
            document.body.classList.toggle('dark-mode', pb && pb.classList.contains('dark-mode'));
        } catch(e) {}
    }
    syncTheme();
    try {
        const pb = parent.document.querySelector('body');
        if(pb) new MutationObserver(syncTheme).observe(pb, {attributes:true, attributeFilter:['class']});
    } catch(e) {}

    const $ = id => document.getElementById(id);
    const API = window.location.origin;
    const toast = $('toast');
    function showToast(msg, ms=3000) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), ms);
    }

    let users = [];
    const tableContainer = $('tableContainer');
    const searchInput = $('userSearch');
    const clearSearchBtn = $('clearSearch');

    // Helper that only cares about HTTP status
    async function postRequest(endpoint, body) {
        const res = await fetch(API + endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify(body)
        });
        if (!res.ok) {
            let detail = '';
            try { const t = await res.text(); detail = ': ' + t; } catch(e) {}
            throw new Error(`HTTP ${res.status}${detail}`);
        }
        return true;
    }

    // Fetch JSON helper (for read operations)
    async function fetchJSON(endpoint, body = null) {
        const opts = { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include' };
        if (body !== null) opts.body = JSON.stringify(body);
        const res = await fetch(API + endpoint, opts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    }

    async function loadUsers() {
        try {
            const data = await fetchJSON('/userListAPI');
            users = Array.isArray(data) ? data : [];
            renderTable();
        } catch(e) {
            console.error(e);
            tableContainer.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">❌ Failed to load users</div>';
        }
    }

    function renderTable() {
        const query = searchInput.value.trim().toLowerCase();
        const filtered = users.filter(u => u.USERNAME.toLowerCase().includes(query));

        if (filtered.length === 0) {
            tableContainer.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">📭 No users found</div>';
            return;
        }

        const html = `
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Current Base Salary</th>
                        <th>New Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map(u => `
                        <tr>
                            <td>${u.SYS_USER_ID}</td>
                            <td>${escapeHtml(u.USERNAME)}</td>
                            <td>${u.BASE_SALARY != null ? u.BASE_SALARY : '—'}</td>
                            <td><input type="number" step="0.01" class="salary-input" id="salary-${u.SYS_USER_ID}" value="${u.BASE_SALARY != null ? u.BASE_SALARY : ''}" /></td>
                            <td><button class="btn save-btn" data-id="${u.SYS_USER_ID}">💾 Save</button></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        tableContainer.innerHTML = html;

        // Attach save listeners
        tableContainer.querySelectorAll('.save-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const userId = parseInt(btn.dataset.id);
                const inputEl = document.getElementById('salary-' + userId);
                const newSalary = inputEl.value.trim();
                if (newSalary === '') {
                    showToast('❌ Please enter a salary value.');
                    return;
                }
                const salaryNum = parseFloat(newSalary);
                if (isNaN(salaryNum)) {
                    showToast('❌ Invalid number.');
                    return;
                }
                await updateSalary(userId, salaryNum);
            });
        });
    }

    async function updateSalary(userId, salary) {
        const payload = [{
            p1: salary,
            p2: userId
        }];
        try {
            // Use postRequest instead of fetchJSON – ignores empty body
            await postRequest('/setUserBaseIncomeAPI', payload);
            showToast('✅ Salary updated successfully.');
            await loadUsers();   // Refresh table
        } catch(e) {
            console.error(e);
            showToast('❌ Failed to update salary.');
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }

    searchInput.addEventListener('input', renderTable);
    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        renderTable();
    });

    await loadUsers();
})();
</script>
</body>
</html>
