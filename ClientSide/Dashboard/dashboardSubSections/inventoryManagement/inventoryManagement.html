<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Inventory Management</title>
  <style>
    /* ---------- GLOBAL VARIABLES ---------- */
    :root {
      --bg-body: #eef2f7;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --bg-table-header: #f1f5f9;
      --bg-table-row-even: #fafbfc;
      --bg-table-row-hover: #eef2ff;
      --bg-badge: #e8edf4;
      --bg-stat-card: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-label: #334155;
      --text-input: #1e293b;
      --border-card: #dde4ef;
      --border-input: #d5dce8;
      --border-table: #e2e8f0;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05), 0 1px 6px rgba(0, 0, 0, 0.03);
      --shadow-card-hover: 0 8px 30px rgba(0, 0, 0, 0.1);
      --accent: #4a6fa5;
      --accent-light: #5a8fc7;
      --accent-soft: #e8edf4;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-stack: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      --letter-spacing-tight: -0.01em;
      --bg-scrollbar: #c8d2e0;
      --bg-scrollbar-track: #f1f5f9;
      --stat-product: #3b82f6;
      --stat-category: #8b5cf6;
      --stat-location: #14b8a6;
      --stat-active: #f59e0b;
      --stat-all: #6366f1;
    }

    body.dark-mode {
      --bg-body: #171a21;
      --bg-card: #1e2128;
      --bg-input: #252830;
      --bg-table-header: #252830;
      --bg-table-row-even: #1f2229;
      --bg-table-row-hover: #282d38;
      --bg-badge: #252d3a;
      --bg-stat-card: #252830;
      --text-primary: #e2e6ec;
      --text-secondary: #b0b8c4;
      --text-muted: #6b7280;
      --text-label: #c5cad4;
      --text-input: #e2e6ec;
      --border-card: #2e333d;
      --border-input: #3a404d;
      --border-table: #2a2f3a;
      --shadow-card: 0 4px 24px rgba(0,0,0,0.25), 0 1px 6px rgba(0,0,0,0.2);
      --shadow-card-hover: 0 8px 30px rgba(0,0,0,0.35);
      --bg-scrollbar: #3a404d;
      --bg-scrollbar-track: #1e2128;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-stack);
      letter-spacing: var(--letter-spacing-normal, 0.01em);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-body);
      transition: background-color var(--transition-smooth);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-scrollbar-track); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--bg-scrollbar); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ---------- MAIN LAYOUT ---------- */
    .inventory-dashboard {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 24px 24px;
      height: 100%;
      max-width: 100%;
    }

    /* ---------- HEADER CARD ---------- */
    .header-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 18px 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-icon-circle {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #4a6fa5, #3b5998);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    body.dark-mode .header-icon-circle {
      background: linear-gradient(135deg, #5a8fc7, #4a7db5);
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: var(--letter-spacing-tight);
      margin: 0;
    }
    .header-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 2px 0 0;
    }

    /* ---------- NAV BUTTONS (keep the core tab functionality) ---------- */
    .nav-buttons-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1 1 auto;
      justify-content: flex-end;
    }

    .nav-action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      cursor: pointer;
      user-select: none;
      background-color: var(--bg-card);
      border: 2px solid var(--border-card);
      transition: all var(--transition-smooth);
      text-align: left;
      min-width: 170px;
      flex: 1 1 170px;
      max-width: 260px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .nav-action-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--accent);
    }
    .nav-action-btn .btn-icon-circle {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      font-weight: 700;
      color: #fff;
    }
    .btn-icon-circle.products { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-icon-circle.categories { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
    .btn-icon-circle.stocks { background: linear-gradient(135deg, #14b8a6, #0f766e); }
    .btn-icon-circle.trips { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-text-group { display: flex; flex-direction: column; gap: 2px; }
    .btn-label { font-weight: 700; font-size: 0.9rem; color: var(--text-primary); margin: 0; }
    .btn-desc { font-size: 0.7rem; color: var(--text-muted); margin: 0; }

    /* ---------- CONTENT ROW: TABLE + STATS ---------- */
    .content-row {
      display: flex;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    /* ---------- LOW STOCK TABLE CARD ---------- */
    .table-card {
      flex: 3;
      background-color: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .table-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border-table);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .table-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      position: relative;
    }
    .search-box input {
      padding: 8px 36px 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-input);
      background-color: var(--bg-input);
      color: var(--text-input);
      font-size: 0.85rem;
      width: 220px;
      transition: all var(--transition-smooth);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74,111,165,0.15);
    }
    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .table-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 0 4px 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 10px 14px;
      background-color: var(--bg-table-header);
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    td {
      padding: 10px 14px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-table);
    }
    tbody tr { transition: background-color 0.15s; }
    tbody tr:nth-child(even) { background-color: var(--bg-table-row-even); }
    tbody tr:hover { background-color: var(--bg-table-row-hover); }
    .no-results {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ---------- STATS SIDEBAR ---------- */
    .stats-sidebar {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 220px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all var(--transition-smooth);
      cursor: default;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #fff;
      flex-shrink: 0;
    }
    .stat-icon.products { background: var(--stat-product); }
    .stat-icon.categories { background: var(--stat-category); }
    .stat-icon.locations { background: var(--stat-location); }
    .stat-icon.active { background: var(--stat-active); }
    .stat-icon.all { background: var(--stat-indigo, #6366f1); }

    .stat-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .stat-desc {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    /* ---------- LOADING & ERROR ---------- */
    .loading-text {
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 8px;
      text-align: center;
    }
    .error-text {
      color: #f43f5e;
      font-size: 0.8rem;
      text-align: center;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .content-row {
        flex-direction: column;
      }
      .stats-sidebar {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
      }
      .stat-card {
        flex: 1 1 140px;
      }
    }
    @media (max-width: 600px) {
      .header-card {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-buttons-group {
        flex-direction: column;
      }
      .nav-action-btn {
        max-width: 100%;
      }
      .search-box input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="inventory-dashboard">
    <!-- HEADER with title + navigation (keeps core tab behavior) -->
    <div class="header-card">
      <div class="header-title-group">
        <div class="header-icon-circle">📦</div>
        <div>
          <p class="header-title">Inventory Management</p>
          <p class="header-subtitle">Live stock overview & low‑stock alerts</p>
        </div>
      </div>
      <div class="nav-buttons-group">
        <button onclick="createTab(this)" class="nav-action-btn" data-AccessCode="16" data-direction="inventoryManagement/products">
          <div class="btn-icon-circle products">📦</div>
          <div class="btn-text-group">
            <span class="btn-label">Products</span>
            <span class="btn-desc">Manage catalog</span>
          </div>
        </button>
        <button onclick="createTab(this)" class="nav-action-btn" data-AccessCode="17" data-direction="inventoryManagement/productsCategories">
          <div class="btn-icon-circle categories">🏷️</div>
          <div class="btn-text-group">
            <span class="btn-label">Categories</span>
            <span class="btn-desc">Organize items</span>
          </div>
        </button>
        <button onclick="createTab(this)" class="nav-action-btn" data-AccessCode="18" data-direction="inventoryManagement/stockLevels">
          <div class="btn-icon-circle stocks">📊</div>
          <div class="btn-text-group">
            <span class="btn-label">Stocks</span>
            <span class="btn-desc">View levels</span>
          </div>
        </button>
      </div>
    </div>

    <!-- MAIN CONTENT: low stock table + count overview -->
    <div class="content-row">
      <!-- LOW STOCK TABLE -->
      <div class="table-card">
        <div class="table-header">
          <div class="table-title">
            <span>⚠️</span> Low Stock Products (below 5 units)
          </div>
          <div class="search-box">
            <input type="text" id="lowStockSearch" placeholder="Search by name or location..." autocomplete="off" />
            <span class="search-icon">🔍</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="lowStockTable">
            <thead>
              <tr>
                <th>Stock ID</th>
                <th>Product Name</th>
                <th>Inventory Location</th>
                <th>Count in Stock</th>
              </tr>
            </thead>
            <tbody id="lowStockBody">
              <tr><td colspan="4" class="loading-text">Loading low stock data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- COUNTS OVERVIEW (right) -->
      <div class="stats-sidebar">
        <div class="stat-card" id="statProducts">
          <div class="stat-icon products">📦</div>
          <div class="stat-info">
            <span class="stat-label">Total Products</span>
            <span class="stat-value" id="countProducts">--</span>
          </div>
        </div>
        <div class="stat-card" id="statCategories">
          <div class="stat-icon categories">🏷️</div>
          <div class="stat-info">
            <span class="stat-label">Categories</span>
            <span class="stat-value" id="countCategories">--</span>
          </div>
        </div>
        <div class="stat-card" id="statLocations">
          <div class="stat-icon locations">📍</div>
          <div class="stat-info">
            <span class="stat-label">Locations</span>
            <span class="stat-value" id="countLocations">--</span>
          </div>
        </div>
        <div class="stat-card" id="statActiveMovements">
          <div class="stat-icon active">🔄</div>
          <div class="stat-info">
            <span class="stat-label">Active Movements</span>
            <span class="stat-value" id="countActive">--</span>
          </div>
        </div>
        <div class="stat-card" id="statAllMovements">
          <div class="stat-icon all">📋</div>
          <div class="stat-info">
            <span class="stat-label">All Movements</span>
            <span class="stat-value" id="countAllMovements">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ── DARK MODE SYNC WITH PARENT ──
      function applyTheme(mode) {
        if (mode === 'dark') document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
      }

      let currentTheme = 'light';
      try {
        currentTheme = parent.document.querySelector("body").classList.contains("dark-mode") ? "dark" : "light";
      } catch(e) {}
      applyTheme(currentTheme);

      // Observe parent class changes
      try {
        const parentBody = parent.document.querySelector("body");
        if (parentBody) {
          const observer = new MutationObserver(() => {
            const isDark = parentBody.classList.contains('dark-mode');
            applyTheme(isDark ? 'dark' : 'light');
          });
          observer.observe(parentBody, { attributes: true, attributeFilter: ['class'] });
        }
      } catch(e) {}

      // Fallback localStorage sync
      window.addEventListener('storage', (e) => {
        if (e.key === 'dashboardTheme') {
          applyTheme(e.newValue === 'dark' ? 'dark' : 'light');
        }
      });

      // ── TOKEN RETRIEVAL ──
      function getUserToken() {
        try {
          if (parent && parent.sessionStorage) {
            return parent.sessionStorage.getItem('userToken') || '';
          }
        } catch(e) {}
        // Fallback: read from current session
        return sessionStorage.getItem('userToken') || '';
      }

      // ── CORE TAB FUNCTION (preserves original behavior) ──
      window.createTab = function(element) {
        const direction = element.dataset.direction;
        const label = element.innerText.trim() || element.textContent.trim();
        try {
          window.parent.createTab(direction, label);
        } catch(e) {
          console.warn('parent.createTab not available, opening direction:', direction);
        }
      };

      // ── API CALLER (POST) ──
      async function fetchCount(endpoint) {
        const token = getUserToken();
        const url = `${window.location.origin}${endpoint}`;
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          // Expected: [{ "COUNT": number }]
          if (Array.isArray(data) && data.length > 0 && data[0].COUNT !== undefined) {
            return data[0].COUNT;
          }
          return 0;
        } catch(err) {
          console.error(`Failed to fetch ${endpoint}:`, err);
          return null; // null = error
        }
      }

      // ── UPDATE STAT CARDS ──
      async function refreshCounts() {
        const endpoints = {
          products: '/productsCountAPI',
          categories: '/productsCategoryCountAPI',
          locations: '/inventoryLocationCountAPI',
          active: '/activeMovementsCountAPI',
          all: '/allMovementsCountAPI'
        };

        const updates = [
          { key: 'products', el: document.getElementById('countProducts') },
          { key: 'categories', el: document.getElementById('countCategories') },
          { key: 'locations', el: document.getElementById('countLocations') },
          { key: 'active', el: document.getElementById('countActive') },
          { key: 'all', el: document.getElementById('countAllMovements') }
        ];

        const promises = updates.map(async (item) => {
          const count = await fetchCount(endpoints[item.key]);
          if (count !== null) {
            item.el.textContent = count;
          } else {
            item.el.textContent = 'Err';
            item.el.style.color = '#f43f5e';
          }
        });
        await Promise.all(promises);
      }

      // ── LOW STOCK TABLE ──
      async function loadLowStock() {
        const tbody = document.getElementById('lowStockBody');
        const token = getUserToken();
        try {
          const res = await fetch(`${window.location.origin}/lowStockProductsAPI`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
          });
          if (!res.ok) throw new Error('Failed to load low stock');
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error('Invalid format');

          window.lowStockData = data; // store for search filtering
          renderLowStockTable(data);
        } catch(err) {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="4" class="error-text">⚠️ Could not load low stock data.</td></tr>`;
        }
      }

      function renderLowStockTable(data) {
        const tbody = document.getElementById('lowStockBody');
        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="no-results">🎉 No low‑stock items found.</td></tr>`;
          return;
        }
        let html = '';
        data.forEach(item => {
          html += `<tr>
            <td>${escapeHtml(item.PRODUCTS_STOCKS_ID)}</td>
            <td>${escapeHtml(item.PRODUCTS_NAME)}</td>
            <td>${escapeHtml(item.INVENTORY_LOCATION_NAME)}</td>
            <td><strong>${escapeHtml(String(item.PRODUCT_COUNT_IN_STOCK))}</strong></td>
          </tr>`;
        });
        tbody.innerHTML = html;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // ── SEARCH FILTER ──
      document.getElementById('lowStockSearch').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        const allData = window.lowStockData || [];
        if (!allData.length) return;
        if (query === '') {
          renderLowStockTable(allData);
          return;
        }
        const filtered = allData.filter(item => {
          const name = (item.PRODUCTS_NAME || '').toLowerCase();
          const location = (item.INVENTORY_LOCATION_NAME || '').toLowerCase();
          return name.includes(query) || location.includes(query);
        });
        renderLowStockTable(filtered);
      });

      // ── INITIAL LOAD ──
      refreshCounts();
      loadLowStock();

      // Optional: auto-refresh counts every 60s
      setInterval(refreshCounts, 60000);
      setInterval(loadLowStock, 60000);
    })();
  </script>
</body>
</html>
