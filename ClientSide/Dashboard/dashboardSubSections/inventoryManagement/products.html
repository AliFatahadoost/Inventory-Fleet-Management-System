<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Products Management</title>
  <style>
    :root {
      --bg-body: #eef2f7;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --bg-table-header: #f1f5f9;
      --bg-table-row-even: #fafbfc;
      --bg-table-row-hover: #eef2ff;
      --bg-modal: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-input: #1e293b;
      --border-card: #dde4ef;
      --border-input: #d5dce8;
      --border-table: #e2e8f0;
      --shadow-card: 0 4px 24px rgba(0,0,0,0.05);
      --accent: #4a6fa5;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --transition: 0.2s ease;
    }
    body.dark-mode {
      --bg-body: #171a21;
      --bg-card: #1e2128;
      --bg-input: #252830;
      --bg-table-header: #252830;
      --bg-table-row-even: #1f2229;
      --bg-table-row-hover: #282d38;
      --bg-modal: #1e2128;
      --text-primary: #e2e6ec;
      --text-secondary: #b0b8c4;
      --text-muted: #6b7280;
      --text-input: #e2e6ec;
      --border-card: #2e333d;
      --border-input: #3a404d;
      --border-table: #2a2f3a;
      --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg-body); color: var(--text-primary); height: 100vh; display: flex; transition: background 0.3s; }
    button { cursor: pointer; border: none; background: none; font-size: inherit; }
    input, select { font-size: 0.9rem; }

    .app-container { display: flex; width: 100%; height: 100%; overflow: hidden; }
    .table-area { flex: 1; min-width: 0; transition: flex 0.3s; display: flex; flex-direction: column; padding: 16px; }
    .form-panel { width: 0; overflow: hidden; background: var(--bg-card); border-left: 1px solid var(--border-card); transition: width 0.3s; display: flex; flex-direction: column; }
    .form-panel.open { width: 50%; min-width: 300px; padding: 20px; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .search-wrapper { position: relative; flex: 1; max-width: 280px; }
    .search-wrapper input {
      width: 100%; padding: 8px 36px 8px 14px;
      border: 1px solid var(--border-input); border-radius: var(--radius-sm);
      background: var(--bg-input); color: var(--text-input);
    }
    .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .action-btns { display: flex; gap: 8px; }
    .action-btns button {
      background: var(--bg-input); border: 1px solid var(--border-input);
      border-radius: var(--radius-sm); padding: 8px 14px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; transition: all var(--transition);
    }
    .action-btns button:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
    .action-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

    .table-wrapper { flex: 1; overflow-y: auto; border: 1px solid var(--border-table); border-radius: var(--radius-md); background: var(--bg-card); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: var(--bg-table-header); padding: 10px; text-align: left; position: sticky; top: 0; }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border-table); }
    tbody tr:nth-child(even) { background: var(--bg-table-row-even); }
    tbody tr:hover { background: var(--bg-table-row-hover); }
    .radio-cell { width: 40px; text-align: center; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .pagination button { padding: 6px 12px; border: 1px solid var(--border-input); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary); }
    .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pagination button:disabled { opacity: 0.4; }

    .form-panel h3 { margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .form-group input {
      width: 100%; padding: 10px;
      border: 1px solid var(--border-input); border-radius: var(--radius-sm);
      background: var(--bg-input); color: var(--text-input);
    }
    .category-selector { display: flex; gap: 8px; }
    .category-selector input {
      flex: 1; background: var(--bg-input); border: 1px solid var(--border-input);
      border-radius: var(--radius-sm); padding: 10px; color: var(--text-input);
    }
    .category-selector button {
      padding: 8px 14px; background: var(--accent); color: #fff;
      border-radius: var(--radius-sm); font-weight: 600;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: var(--radius-sm); }
    .btn-secondary { background: var(--bg-input); border: 1px solid var(--border-input); padding: 10px 20px; border-radius: var(--radius-sm); color: var(--text-primary); }
    .close-btn { background: none; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--text-muted); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content { background: var(--bg-modal); border-radius: var(--radius-lg); padding: 20px; min-width: 320px; max-width: 500px; max-height: 70vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-search { margin-bottom: 12px; }
    .modal-search input {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border-input); border-radius: var(--radius-sm);
      background: var(--bg-input); color: var(--text-input); font-size: 0.85rem;
    }
    .modal-table { width: 100%; border-collapse: collapse; }
    .modal-table th, .modal-table td { padding: 8px; border-bottom: 1px solid var(--border-table); }
    .modal-table tr { cursor: pointer; }
    .modal-table tr:hover { background: var(--bg-table-row-hover); }
    .confirm-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    .toast { position: fixed; bottom: 30px; right: 30px; background: #1e293b; color: #fff; padding: 10px 20px; border-radius: var(--radius-sm); z-index: 2000; opacity: 0; transition: 0.3s; }
    .toast.show { opacity: 1; }
    body.dark-mode .toast { background: #f1f5f9; color: #1e293b; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="table-area" id="tableArea">
    <div class="toolbar">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off" />
        <span class="search-icon">🔍</span>
      </div>
      <div class="action-btns">
        <button id="addBtn" title="Add new product"><span>➕</span> Add</button>
        <button id="editBtn" disabled title="Edit selected product"><span>✏️</span> Edit</button>
        <button id="deleteBtn" disabled title="Delete selected product"><span>🗑️</span> Delete</button>
      </div>
    </div>
    <div class="table-wrapper">
      <table id="productTable">
        <thead><tr><th></th><th>ID</th><th>Product Name</th><th>Category</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="form-panel" id="formPanel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="formTitle">New Product</h3>
      <button class="close-btn" id="closeFormBtn">✖</button>
    </div>
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="productNameInput" placeholder="Enter product name" />
    </div>
    <div class="form-group">
      <label>Category</label>
      <div class="category-selector">
        <input type="text" id="categoryDisplay" readonly placeholder="Select a category from the list" />
        <input type="hidden" id="categoryIdInput" />
        <button id="selectCategoryBtn">📋 Select</button>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="cancelFormBtn">Cancel</button>
      <button class="btn-primary" id="saveFormBtn">Save</button>
    </div>
  </div>
</div>

<!-- Category selection modal -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal-content">
    <div class="modal-header">
      <h4>Select Category</h4>
      <button class="close-btn" id="closeCategoryModalBtn">✖</button>
    </div>
    <div class="modal-search">
      <input type="text" id="categorySearch" placeholder="Search categories..." autocomplete="off" />
    </div>
    <div style="max-height: 300px; overflow-y: auto;">
      <table class="modal-table">
        <thead><tr><th>ID</th><th>Category Name</th></tr></thead>
        <tbody id="categoryTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-content">
    <h4>Confirm Deletion</h4>
    <p style="margin: 12px 0;">Are you sure you want to delete <strong id="deleteProductName"></strong>?</p>
    <div class="confirm-buttons">
      <button class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
      <button class="btn-primary" id="confirmDeleteBtn" style="background: #e74c3c;">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (() => {
    // ── Dark mode sync ──
    function syncTheme() {
      try {
        const parentBody = parent.document.querySelector("body");
        if (parentBody && parentBody.classList.contains("dark-mode")) document.body.classList.add("dark-mode");
        else document.body.classList.remove("dark-mode");
      } catch(e) {}
    }
    syncTheme();
    try {
      const parentBody = parent.document.querySelector("body");
      if (parentBody) new MutationObserver(syncTheme).observe(parentBody, {attributes: true, attributeFilter: ['class']});
    } catch(e) {}

    // ── Globals ──
    const productsPerPage = 50;
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 1;
    let selectedRowIndex = -1;
    let categoriesMap = new Map(); // name -> id
    let editMode = false;
    let originalProductName = '';

    // DOM elements
    const tableBody = document.getElementById('tableBody');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const addBtn = document.getElementById('addBtn');
    const editBtn = document.getElementById('editBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const formPanel = document.getElementById('formPanel');
    const formTitle = document.getElementById('formTitle');
    const productNameInput = document.getElementById('productNameInput');
    const categoryDisplay = document.getElementById('categoryDisplay');
    const categoryIdInput = document.getElementById('categoryIdInput');
    const selectCategoryBtn = document.getElementById('selectCategoryBtn');
    const saveFormBtn = document.getElementById('saveFormBtn');
    const cancelFormBtn = document.getElementById('cancelFormBtn');
    const closeFormBtn = document.getElementById('closeFormBtn');
    const categoryModal = document.getElementById('categoryModal');
    const categorySearch = document.getElementById('categorySearch');
    const categoryTableBody = document.getElementById('categoryTableBody');
    const deleteModal = document.getElementById('deleteModal');
    const deleteProductName = document.getElementById('deleteProductName');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
    const toast = document.getElementById('toast');

    function showToast(msg, duration = 2500) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    const API_BASE = window.location.origin;

    // Fetch helpers (these return JSON)
    async function fetchJSON(url) {
      const res = await fetch(url, { method: 'POST' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // SP caller – sends object, does NOT parse empty response
    async function callSP(payload) {
      console.log('📤 Sending to SP:', payload);
      const res = await fetch(API_BASE + '/manageInventoryInfstructureAPI', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('SP call failed');
      console.log('✅ SP call succeeded');
    }

    // Load products
    async function loadProducts() {
      try {
        const data = await fetchJSON('/productsWithCategoryAPI');
        allProducts = Array.isArray(data) ? data : [];
        filterAndPaginate();
      } catch(e) {
        console.error(e);
        showToast('Failed to load products.');
        allProducts = [];
        filterAndPaginate();
      }
    }

    // Load categories for modal
    async function loadCategories() {
      try {
        const data = await fetchJSON('/productsCategoryListAPI');
        categoriesMap.clear();
        if (Array.isArray(data)) {
          data.forEach(cat => categoriesMap.set(cat.PRODUCTS_CATEGORY_NAME, cat.PRODUCTS_CATEGORY_ID));
        }
      } catch(e) {
        console.error(e);
        showToast('Failed to load categories.');
      }
    }

    // ── Rendering ──
    function filterAndPaginate() {
      const query = searchInput.value.toLowerCase().trim();
      filteredProducts = allProducts.filter(p => (p.PRODUCTS_NAME || '').toLowerCase().includes(query));
      currentPage = 1;
      renderTable();
      renderPagination();
    }

    function renderTable() {
      const start = (currentPage - 1) * productsPerPage;
      const pageItems = filteredProducts.slice(start, start + productsPerPage);
      let html = '';
      pageItems.forEach((prod, idx) => {
        const globalIndex = start + idx;
        html += `<tr>
          <td class="radio-cell"><input type="radio" name="prodSelect" value="${globalIndex}" ${globalIndex === selectedRowIndex ? 'checked' : ''} /></td>
          <td>${escapeHtml(prod.PRODUCTS_ID)}</td>
          <td>${escapeHtml(prod.PRODUCTS_NAME)}</td>
          <td>${escapeHtml(prod.PRODUCTS_CATEGORY_NAME || '')}</td>
        </tr>`;
      });
      tableBody.innerHTML = html || '<tr><td colspan="4" style="text-align:center;padding:20px;">No products found.</td></tr>';

      document.querySelectorAll('input[name="prodSelect"]').forEach(radio => {
        radio.addEventListener('change', function() {
          selectedRowIndex = parseInt(this.value);
          updateActionButtons();
        });
      });

      if (selectedRowIndex >= start && selectedRowIndex < start + productsPerPage) {
        const radio = document.querySelector(`input[name="prodSelect"][value="${selectedRowIndex}"]`);
        if (radio) radio.checked = true;
      } else {
        const checkedRadio = document.querySelector('input[name="prodSelect"]:checked');
        if (checkedRadio) checkedRadio.checked = false;
      }
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredProducts.length / productsPerPage) || 1;
      let html = '';
      html += `<button ${currentPage === 1 ? 'disabled' : ''} data-page="prev">← Prev</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="next">Next →</button>`;
      pagination.innerHTML = html;
      pagination.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const page = btn.dataset.page;
          if (page === 'prev' && currentPage > 1) currentPage--;
          else if (page === 'next' && currentPage < totalPages) currentPage++;
          else if (!isNaN(page)) currentPage = parseInt(page);
          renderTable();
          renderPagination();
        });
      });
    }

    function updateActionButtons() {
      const selected = selectedRowIndex >= 0 && selectedRowIndex < filteredProducts.length;
      editBtn.disabled = !selected;
      deleteBtn.disabled = !selected;
    }

    // ── Form management ──
    function openForm(title, edit = false, product = null) {
      formPanel.classList.add('open');
      formTitle.textContent = title;
      productNameInput.value = product ? product.PRODUCTS_NAME : '';
      categoryDisplay.value = product ? (product.PRODUCTS_CATEGORY_NAME || '') : '';
      categoryIdInput.value = product ? (categoriesMap.get(product.PRODUCTS_CATEGORY_NAME) || '') : '';
      editMode = edit;
      originalProductName = product ? product.PRODUCTS_NAME : '';
    }

    function closeForm() {
      formPanel.classList.remove('open');
      productNameInput.value = '';
      categoryDisplay.value = '';
      categoryIdInput.value = '';
      editMode = false;
    }

    // ── Category modal ──
    function openCategoryModal() {
      categoryModal.classList.add('active');
      renderCategoryTable();
    }

    function closeCategoryModal() {
      categoryModal.classList.remove('active');
    }

    function renderCategoryTable() {
      let entries = Array.from(categoriesMap.entries());
      const query = categorySearch.value.toLowerCase().trim();
      if (query) entries = entries.filter(([name]) => name.toLowerCase().includes(query));
      categoryTableBody.innerHTML = entries.map(([name, id]) => 
        `<tr data-id="${id}" data-name="${escapeHtml(name)}"><td>${id}</td><td>${escapeHtml(name)}</td></tr>`
      ).join('');
      categoryTableBody.querySelectorAll('tr').forEach(tr => {
        tr.addEventListener('click', () => {
          categoryDisplay.value = tr.dataset.name;
          categoryIdInput.value = tr.dataset.id;
          closeCategoryModal();
        });
      });
    }

    // ── Save product (add/edit) ──
    async function saveProduct() {
      const name = productNameInput.value.trim();
      const categoryId = parseInt(categoryIdInput.value.trim());
      if (!name) return showToast('Product name required.');
      if (isNaN(categoryId)) return showToast('Please select a category.');

      // Check for duplicate name (if adding new)
      if (!editMode && allProducts.some(p => p.PRODUCTS_NAME === name)) {
        showToast('⚠️ Product with this name already exists (may have been reactivated).', 4000);
        // The SP will just set IS_DELETED=0, so it's not a true addition.
        // We'll still proceed because it's allowed, but you can add a confirmation if desired.
      }

      const payload = {
        action: editMode ? 'MODIFY_PRODUCTS' : 'ADD_PRODUCTS',
        inventoryLocationTitle: "",
        newInventoryLocationTitle: "",
        productsName: editMode ? originalProductName : name,
        newProductsName: editMode ? name : "",
        productsCategoryId: categoryId,
        productsCategoryName: "",
        newProductsCategoryName: ""
      };

      try {
        await callSP(payload);
        showToast(editMode ? 'Product updated.' : 'Product added.');
        closeForm();
        await loadProducts();
        selectedRowIndex = -1;
        updateActionButtons();
      } catch(e) {
        console.error(e);
        showToast('Operation failed.');
      }
    }

    // ── Delete ──
    function promptDelete() {
      if (selectedRowIndex < 0) return;
      const product = filteredProducts[selectedRowIndex];
      deleteProductName.textContent = product.PRODUCTS_NAME;
      deleteModal.classList.add('active');
    }

    async function performDelete() {
      if (selectedRowIndex < 0) return;
      const product = filteredProducts[selectedRowIndex];
      const payload = {
        action: 'DELETE_PRODUCTS',
        inventoryLocationTitle: "",
        newInventoryLocationTitle: "",
        productsName: product.PRODUCTS_NAME,
        newProductsName: "",
        productsCategoryId: 0,
        productsCategoryName: "",
        newProductsCategoryName: ""
      };
      try {
        await callSP(payload);
        showToast('Product deleted.');
        deleteModal.classList.remove('active');
        await loadProducts();
        selectedRowIndex = -1;
        updateActionButtons();
      } catch(e) {
        console.error(e);
        showToast('Deletion failed.');
      }
    }

    // ── Event listeners ──
    searchInput.addEventListener('input', filterAndPaginate);
    addBtn.addEventListener('click', () => openForm('New Product', false));
    editBtn.addEventListener('click', () => {
      if (selectedRowIndex < 0) return;
      const product = filteredProducts[selectedRowIndex];
      openForm('Edit Product', true, product);
    });
    deleteBtn.addEventListener('click', promptDelete);
    closeFormBtn.addEventListener('click', closeForm);
    cancelFormBtn.addEventListener('click', closeForm);
    saveFormBtn.addEventListener('click', saveProduct);
    selectCategoryBtn.addEventListener('click', openCategoryModal);
    document.getElementById('closeCategoryModalBtn').addEventListener('click', closeCategoryModal);
    categorySearch.addEventListener('input', renderCategoryTable);
    document.getElementById('cancelDeleteBtn').addEventListener('click', () => deleteModal.classList.remove('active'));
    confirmDeleteBtn.addEventListener('click', performDelete);
    window.addEventListener('click', (e) => {
      if (e.target === categoryModal) closeCategoryModal();
      if (e.target === deleteModal) deleteModal.classList.remove('active');
    });

    // Initial load
    (async () => {
      await loadCategories();
      await loadProducts();
    })();
  })();

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
