<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management</title>
    <style>
        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-table-header: #f1f5f9;
            --bg-table-row-even: #fafbfc;
            --bg-table-row-hover: #eef2ff;
            --bg-pill-default: #e2e7ef;
            --bg-pill-active: #4a6fa5;
            --bg-pagination: #f1f5f9;
            --bg-pagination-active: #4a6fa5;
            --bg-button-primary: #4a6fa5;
            --bg-button-hover: #3b5998;
            --bg-search: #ffffff;
            --bg-badge: #e8edf4;
            --bg-avatar: #4a6fa5;
            --bg-overlay: rgba(255, 255, 255, 0.92);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-pill-default: #475569;
            --text-pill-active: #ffffff;
            --text-pagination: #475569;
            --text-pagination-active: #ffffff;
            --text-button: #ffffff;
            --text-label: #334155;
            --text-input: #1e293b;
            --text-overlay: #64748b;
            --border-card: #dde4ef;
            --border-input: #d5dce8;
            --border-table: #e2e8f0;
            --border-pill: #d5dce8;
            --border-pagination: #d5dce8;
            --border-btn-active: #4a6fa5;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05), 0 1px 6px rgba(0, 0, 0, 0.03);
            --shadow-card-hover: 0 8px 30px rgba(0, 0, 0, 0.1);
            --shadow-button: 0 2px 10px rgba(74, 111, 165, 0.3);
            --shadow-input-focus: 0 0 0 4px rgba(74, 111, 165, 0.1);
            --accent: #4a6fa5;
            --accent-light: #5a8fc7;
            --accent-soft: #e8edf4;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-purple: #8b5cf6;
            --accent-teal: #14b8a6;
            --accent-indigo: #6366f1;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-full: 9999px;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-stack: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            --letter-spacing-tight: -0.01em;
            --letter-spacing-normal: 0.01em;
            --bg-scrollbar: #c8d2e0;
            --bg-scrollbar-track: #f1f5f9;
        }

        body.dark-mode {
            --bg-body: #171a21;
            --bg-card: #1e2128;
            --bg-input: #252830;
            --bg-table-header: #252830;
            --bg-table-row-even: #1f2229;
            --bg-table-row-hover: #282d38;
            --bg-pill-default: #2a2f3a;
            --bg-pill-active: #5a8fc7;
            --bg-pagination: #252830;
            --bg-pagination-active: #5a8fc7;
            --bg-button-primary: #5a8fc7;
            --bg-button-hover: #4a7db5;
            --bg-search: #252830;
            --bg-badge: #252d3a;
            --bg-avatar: #5a8fc7;
            --bg-overlay: rgba(30, 33, 40, 0.94);
            --text-primary: #e2e6ec;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --text-pill-default: #c5cad4;
            --text-pill-active: #ffffff;
            --text-pagination: #c5cad4;
            --text-pagination-active: #ffffff;
            --text-button: #ffffff;
            --text-label: #c5cad4;
            --text-input: #e2e6ec;
            --text-overlay: #8b92a0;
            --border-card: #2e333d;
            --border-input: #3a404d;
            --border-table: #2a2f3a;
            --border-pill: #3a404d;
            --border-pagination: #3a404d;
            --border-btn-active: #5a8fc7;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.25), 0 1px 6px rgba(0, 0, 0, 0.2);
            --shadow-card-hover: 0 8px 30px rgba(0, 0, 0, 0.35);
            --shadow-button: 0 2px 10px rgba(90, 143, 199, 0.35);
            --shadow-input-focus: 0 0 0 4px rgba(90, 143, 199, 0.15);
            --bg-scrollbar: #3a404d;
            --bg-scrollbar-track: #1e2128;
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-stack);
            letter-spacing: var(--letter-spacing-normal);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-body);
            transition: background-color var(--transition-smooth);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-scrollbar-track);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-scrollbar);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ─── MAIN CONTAINER ─── */
        .management-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 28px 24px;
            height: 100%;
            max-width: 100%;
            margin: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            .management-container {
                padding: 12px 10px 16px;
                gap: 14px;
            }
        }

        /* ─── HEADER CARD ─── */
        .header-card {
            flex-shrink: 0;
            background-color: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 20px 28px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-card .header-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-card .header-icon-circle {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #4a6fa5, #3b5998);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(74, 111, 165, 0.3);
            user-select: none;
        }
        body.dark-mode .header-card .header-icon-circle {
            background: linear-gradient(135deg, #5a8fc7, #4a7db5);
            box-shadow: 0 2px 8px rgba(90, 143, 199, 0.35);
        }

        .header-card .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: var(--letter-spacing-tight);
            margin: 0;
            white-space: nowrap;
        }

        .header-card .header-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 2px 0 0 0;
            white-space: nowrap;
        }

        /* ─── NAV BUTTONS GROUP ─── */
        .nav-buttons-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        /* ─── NAV ACTION BUTTON ─── */
        .nav-action-btn {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 22px;
            border-radius: var(--radius-md);
            cursor: pointer;
            user-select: none;
            transition: all var(--transition-smooth);
            background-color: var(--bg-card);
            border: 2px solid var(--border-card);
            position: relative;
            overflow: hidden;
            text-align: left;
            min-width: 200px;
            flex: 1 1 200px;
            max-width: 320px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
        }

        .nav-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-card-hover);
            border-color: var(--accent);
        }
        .nav-action-btn:active {
            transform: translateY(-1px);
            box-shadow: var(--shadow-card);
        }

        /* Active state */
        .nav-action-btn.active {
            border-color: var(--border-btn-active);
            background-color: var(--accent-soft);
            box-shadow: 0 2px 12px rgba(74, 111, 165, 0.18);
        }
        body.dark-mode .nav-action-btn.active {
            background-color: rgba(90, 143, 199, 0.1);
            box-shadow: 0 2px 12px rgba(90, 143, 199, 0.2);
        }

        .nav-action-btn.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 4px;
            border-radius: 0 3px 3px 0;
            background: var(--accent);
            transition: all var(--transition-smooth);
        }
        body.dark-mode .nav-action-btn.active::before {
            background: var(--accent-light);
        }

        /* Icon circle */
        .nav-action-btn .btn-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            font-weight: 700;
            transition: all var(--transition-smooth);
        }

        .nav-action-btn .btn-icon-circle.users {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
        .nav-action-btn .btn-icon-circle.roles {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .nav-action-btn:hover .btn-icon-circle.users {
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.45);
        }
        .nav-action-btn:hover .btn-icon-circle.roles {
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);
        }

        .nav-action-btn .btn-text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-action-btn .btn-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            letter-spacing: var(--letter-spacing-tight);
            margin: 0;
            line-height: 1.2;
        }

        .nav-action-btn .btn-desc {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.3;
        }

        /* Arrow indicator on hover */
        .nav-action-btn::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 7px;
            height: 7px;
            border-right: 2px solid var(--text-muted);
            border-top: 2px solid var(--text-muted);
            transition: all var(--transition-fast);
            opacity: 0;
        }
        .nav-action-btn:hover::after {
            opacity: 1;
            right: 12px;
            border-color: var(--accent);
        }
        .nav-action-btn.active::after {
            opacity: 0;
        }

        @media (max-width: 768px) {
            .header-card {
                flex-direction: column;
                align-items: stretch;
                padding: 16px 14px;
            }
            .header-card .header-title-group {
                justify-content: center;
            }
            .nav-buttons-group {
                flex-direction: column;
            }
            .nav-action-btn {
                min-width: auto;
                flex: 1 1 100%;
                max-width: 100%;
            }
            .nav-action-btn::after {
                opacity: 0.4;
            }
        }

        @media (max-width: 480px) {
            .nav-action-btn {
                padding: 12px 14px;
                gap: 10px;
            }
            .nav-action-btn .btn-icon-circle {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
                border-radius: var(--radius-sm);
            }
            .nav-action-btn .btn-label {
                font-size: 0.85rem;
            }
            .nav-action-btn .btn-desc {
                font-size: 0.7rem;
            }
        }

        /* ─── CONTENT CARD ─── */
        .content-card {
            flex: 1;
            min-height: 0;
            background-color: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            position: relative;
            transition: all var(--transition-smooth);
        }

        .content-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            padding: 0;
            margin: 0;
            background-color: transparent;
            display: block;
            z-index: 1;
        }

        /* ─── OVERLAY (Empty State) ─── */
        .iframe-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            background-color: var(--bg-overlay);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity var(--transition-smooth), visibility var(--transition-smooth);
            pointer-events: none;
            user-select: none;
            border-radius: inherit;
        }

        .iframe-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .iframe-overlay .overlay-icon {
            font-size: 4rem;
            line-height: 1;
            animation: floatIcon 3s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .iframe-overlay .overlay-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: var(--letter-spacing-tight);
            margin: 0;
            text-align: center;
        }

        .iframe-overlay .overlay-subtitle {
            font-size: 0.85rem;
            color: var(--text-overlay);
            margin: 0;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
        }

        .iframe-overlay .overlay-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .iframe-overlay .overlay-hint-arrow {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background-color: var(--accent-soft);
            color: var(--accent);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounceHint 1.6s ease-in-out infinite;
        }

        @keyframes bounceHint {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .iframe-overlay .overlay-hint-text {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: var(--letter-spacing-tight);
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #1e293b;
            color: #fff;
            padding: 12px 22px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.35s ease;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            letter-spacing: var(--letter-spacing-tight);
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        body.dark-mode .toast {
            background-color: #f8fafc;
            color: #1e293b;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 480px) {
            .toast {
                bottom: 16px;
                right: 16px;
                left: 16px;
                text-align: center;
                max-width: none;
                white-space: normal;
                font-size: 0.8rem;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="management-container">
        <!-- ─── HEADER CARD ─── -->
        <div class="header-card" id="headerCard">
            <div class="header-title-group">
                <div class="header-icon-circle">⚙️</div>
                <div>
                    <p class="header-title">User Management</p>
                    <p class="header-subtitle">Manage users &amp; access roles</p>
                </div>
            </div>
            <div class="nav-buttons-group">
                <div data-AccessCode="14"
                onclick="userEditForm();"
                class="nav-action-btn"
                id="navUsersBtn"
                title="Create or edit user accounts">
                <div class="btn-icon-circle users">👥</div>
                <div class="btn-text-group">
                    <p class="btn-label">Create-Edit Users</p>
                    <p class="btn-desc">Manage user accounts</p>
                </div>
            </div>
            <div data-AccessCode="15"
            onclick="rolesEditForm();"
            class="nav-action-btn"
            id="navRolesBtn"
            title="Create or edit access roles">
            <div class="btn-icon-circle roles">🛡️</div>
            <div class="btn-text-group">
                <p class="btn-label">Create-Edit Roles</p>
                <p class="btn-desc">Manage access roles</p>
            </div>
        </div>
    </div>
</div>

<!-- ─── CONTENT CARD ─── -->
<div class="content-card" id="contentCard">
    <div class="iframe-overlay" id="iframeOverlay">
        <div class="overlay-icon">📂</div>
        <p class="overlay-title">No Tool Selected</p>
        <p class="overlay-subtitle">Choose a management tool from the options above to get started.</p>
        <div class="overlay-hint">
            <span class="overlay-hint-arrow">↑</span>
            <span class="overlay-hint-text">Select a tool above</span>
        </div>
    </div>
    <iframe id="userManagementIframe" src="" title="Management Content">
    </iframe>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        // ─── Read parent state for theme ───
        let darkLightMode = 'light';
        try {
            darkLightMode = parent.document.querySelector("body").classList.contains("dark-mode") ? "dark" :
                "light";
        } catch (e) {
            darkLightMode = 'light';
        }

        // Apply dark mode if needed
        if (darkLightMode === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // ─── Sync with parent theme changes via MutationObserver ───
        try {
            const parentBody = parent.document.querySelector("body");
            if (parentBody) {
                const observer = new MutationObserver(() => {
                    const isDark = parentBody.classList.contains('dark-mode');
                    if (isDark) {
                        document.body.classList.add('dark-mode');
                    } else {
                        document.body.classList.remove('dark-mode');
                    }
                });
                observer.observe(parentBody, { attributes: true, attributeFilter: ['class'] });
            }
        } catch (e) {
            // Silently fail if cross-origin or other issues
        }

        // Also listen for storage changes (parent may save theme to localStorage)
        window.addEventListener('storage', function(e) {
            if (e.key === 'dashboardTheme') {
                if (e.newValue === 'dark') {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            }
        });

        // ─── Toast helper ───
        function showToast(message, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ─── DOM references ───
        const iframe = document.getElementById('userManagementIframe');
        const overlay = document.getElementById('iframeOverlay');
        const navUsersBtn = document.getElementById('navUsersBtn');
        const navRolesBtn = document.getElementById('navRolesBtn');

        // ─── Track active button ───
        let activeButton = null;

        function setActiveButton(btn) {
            // Remove active from both
            navUsersBtn.classList.remove('active');
            navRolesBtn.classList.remove('active');
            // Set active on the clicked one
            if (btn) {
                btn.classList.add('active');
                activeButton = btn;
            }
        }

        // ─── Iframe load handler ───
        iframe.addEventListener('load', function() {
            // Iframe finished loading content
            if (iframe.src && iframe.src !== 'about:blank' && iframe.src !== window.location.href) {
                overlay.classList.add('hidden');
            }
        });

        // ─── Button click handlers ───
        window.userEditForm = function() {
            const targetSrc = 'http://192.168.100.11:55952/Dashboard/EditUsersFormUsrMngmnt';
            setActiveButton(navUsersBtn);
            overlay.classList.remove('hidden'); // Show overlay briefly during load
            iframe.src = targetSrc;
            showToast('📋 Loading User Editor...');
        };

        window.rolesEditForm = function() {
            const targetSrc = 'http://192.168.100.11:55952/Dashboard/EditRolesFormUsrMngmnt';
            setActiveButton(navRolesBtn);
            overlay.classList.remove('hidden'); // Show overlay briefly during load
            iframe.src = targetSrc;
            showToast('🛡️ Loading Role Editor...');
        };

        // ─── Handle iframe load errors gracefully ───
        iframe.addEventListener('error', function() {
            overlay.classList.remove('hidden');
            const overlayTitle = overlay.querySelector('.overlay-title');
            const overlaySubtitle = overlay.querySelector('.overlay-subtitle');
            if (overlayTitle) overlayTitle.textContent = '⚠️ Connection Error';
            if (overlaySubtitle) overlaySubtitle.textContent =
                'Unable to load the requested page. Please check your connection and try again.';
            showToast('❌ Failed to load content. Please try again.');
        });

        // ─── Initial state ───
        // Iframe starts empty, overlay is visible, no button is active
        overlay.classList.remove('hidden');
        iframe.src = '';
        activeButton = null;
        navUsersBtn.classList.remove('active');
        navRolesBtn.classList.remove('active');

        console.log('✅ User Management dashboard initialized — Theme:', darkLightMode);
    })();
</script>
</body>
</html>
