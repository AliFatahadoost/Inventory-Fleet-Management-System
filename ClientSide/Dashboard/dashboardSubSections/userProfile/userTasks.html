<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Report</title>
    <style>
        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-table-header: #f1f5f9;
            --bg-table-row-even: #fafbfc;
            --bg-table-row-hover: #eef2ff;
            --bg-pill-default: #e2e7ef;
            --bg-pill-active: #4a6fa5;
            --bg-pagination: #f1f5f9;
            --bg-pagination-active: #4a6fa5;
            --bg-button-primary: #4a6fa5;
            --bg-button-hover: #3b5998;
            --bg-search: #ffffff;
            --bg-badge: #e8edf4;
            --bg-avatar: #4a6fa5;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-pill-default: #475569;
            --text-pill-active: #ffffff;
            --text-pagination: #475569;
            --text-pagination-active: #ffffff;
            --text-button: #ffffff;
            --text-label: #334155;
            --text-input: #1e293b;
            --border-card: #dde4ef;
            --border-input: #d5dce8;
            --border-table: #e2e8f0;
            --border-pill: #d5dce8;
            --border-pagination: #d5dce8;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05), 0 1px 6px rgba(0, 0, 0, 0.03);
            --shadow-button: 0 2px 10px rgba(74, 111, 165, 0.3);
            --shadow-input-focus: 0 0 0 4px rgba(74, 111, 165, 0.1);
            --accent: #4a6fa5;
            --accent-light: #5a8fc7;
            --accent-soft: #e8edf4;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-purple: #8b5cf6;
            --accent-teal: #14b8a6;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-full: 9999px;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-stack: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            --letter-spacing-tight: -0.01em;
            --letter-spacing-normal: 0.01em;
            --bg-scrollbar: #c8d2e0;
            --bg-scrollbar-track: #f1f5f9;
        }

        body.dark-mode {
            --bg-body: #171a21;
            --bg-card: #1e2128;
            --bg-input: #252830;
            --bg-table-header: #252830;
            --bg-table-row-even: #1f2229;
            --bg-table-row-hover: #282d38;
            --bg-pill-default: #2a2f3a;
            --bg-pill-active: #5a8fc7;
            --bg-pagination: #252830;
            --bg-pagination-active: #5a8fc7;
            --bg-button-primary: #5a8fc7;
            --bg-button-hover: #4a7db5;
            --bg-search: #252830;
            --bg-badge: #252d3a;
            --bg-avatar: #5a8fc7;
            --text-primary: #e2e6ec;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --text-pill-default: #c5cad4;
            --text-pill-active: #ffffff;
            --text-pagination: #c5cad4;
            --text-pagination-active: #ffffff;
            --text-button: #ffffff;
            --text-label: #c5cad4;
            --text-input: #e2e6ec;
            --border-card: #2e333d;
            --border-input: #3a404d;
            --border-table: #2a2f3a;
            --border-pill: #3a404d;
            --border-pagination: #3a404d;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.25), 0 1px 6px rgba(0, 0, 0, 0.2);
            --shadow-button: 0 2px 10px rgba(90, 143, 199, 0.35);
            --shadow-input-focus: 0 0 0 4px rgba(90, 143, 199, 0.15);
            --bg-scrollbar: #3a404d;
            --bg-scrollbar-track: #1e2128;
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-stack);
            letter-spacing: var(--letter-spacing-normal);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            transition: background-color var(--transition-smooth);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-scrollbar-track);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-scrollbar);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .report-container {
            padding: 24px 28px 32px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 600px) {
            .report-container {
                padding: 12px 10px 20px;
            }
        }

        .chart-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: all var(--transition-smooth);
            display: flex;
            flex-direction: column;
        }

        .chart-card .chart-header {
            padding: 16px 20px;
            border-bottom: 2px solid var(--border-table);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chart-card .chart-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            letter-spacing: var(--letter-spacing-tight);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-card .chart-title .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            background-color: var(--accent-amber);
        }

        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-pill {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--border-pill);
            background-color: var(--bg-pill-default);
            color: var(--text-pill-default);
            transition: all var(--transition-fast);
            white-space: nowrap;
            user-select: none;
            letter-spacing: var(--letter-spacing-tight);
        }
        .filter-pill:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .filter-pill.active {
            background-color: var(--bg-pill-active);
            color: var(--text-pill-active);
            border-color: var(--bg-pill-active);
            box-shadow: 0 2px 8px rgba(74, 111, 165, 0.3);
        }

        .search-row {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid var(--border-table);
            background-color: var(--bg-table-header);
        }
        .search-row .search-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 130px;
        }
        .search-row input {
            padding: 7px 10px;
            border: 2px solid var(--border-input);
            border-radius: var(--radius-sm);
            background-color: var(--bg-search);
            color: var(--text-input);
            font-size: 0.8rem;
            font-weight: 500;
            outline: none;
            transition: all var(--transition-fast);
            width: 100%;
            max-width: 180px;
        }
        .search-row input:focus {
            border-color: var(--accent);
            box-shadow: var(--shadow-input-focus);
        }
        .search-row .search-btn {
            padding: 7px 11px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--accent);
            background-color: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .search-row .search-btn:hover {
            background-color: var(--bg-button-hover);
            border-color: var(--bg-button-hover);
        }
        .search-row .search-clear {
            background-color: transparent;
            border: 2px solid var(--border-input);
            color: var(--text-muted);
        }
        .search-row .search-clear:hover {
            border-color: var(--accent-rose);
            color: var(--accent-rose);
            background-color: transparent;
        }

        .table-wrapper {
            overflow-x: auto;
            flex: 1;
        }
        .chart-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .chart-table thead th {
            background-color: var(--bg-table-header);
            padding: 12px 16px;
            text-align: left;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-table);
            position: sticky;
            top: 0;
            z-index: 2;
            white-space: nowrap;
        }
        .chart-table tbody td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border-table);
            color: var(--text-primary);
            font-weight: 500;
            transition: background-color var(--transition-fast);
            white-space: nowrap;
        }
        .chart-table tbody td.description-cell {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chart-table tbody tr:nth-child(even) {
            background-color: var(--bg-table-row-even);
        }
        .chart-table tbody tr:hover {
            background-color: var(--bg-table-row-hover);
        }

        /* Action buttons */
        .action-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-row-action {
            padding: 5px 12px;
            border-radius: var(--radius-full);
            font-size: 0.73rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition-fast);
            white-space: nowrap;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: var(--bg-pill-default);
            color: var(--text-pill-default);
        }
        .btn-row-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-start {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background-color: rgba(34, 197, 94, 0.08);
        }
        .btn-start:hover {
            background-color: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }
        .btn-finish {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            background-color: rgba(139, 92, 246, 0.08);
        }
        .btn-finish:hover {
            background-color: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }
        body.dark-mode .btn-row-action {
            background-color: var(--bg-pill-default);
        }

        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 2px solid var(--border-table);
            flex-wrap: wrap;
            gap: 10px;
            background-color: var(--bg-pagination);
        }
        .pagination-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pagination-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border-pagination);
            background-color: var(--bg-card);
            color: var(--text-pagination);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .pagination-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--accent-soft);
        }
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination-btn.active {
            background-color: var(--bg-pagination-active);
            color: var(--text-pagination-active);
            border-color: var(--bg-pagination-active);
            box-shadow: 0 2px 6px rgba(74, 111, 165, 0.3);
        }
        .pagination-ellipsis {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 700;
            user-select: none;
        }
        .pagination-arrow {
            font-size: 1.1rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .empty-state p {
            margin: 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .hidden-el {
            display: none !important;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.35s ease;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            letter-spacing: var(--letter-spacing-tight);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        body.dark-mode .toast {
            background-color: #f8fafc;
            color: #1e293b;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .chart-table tbody td.description-cell:hover {
            overflow: visible;
            white-space: normal;
            word-break: break-word;
            background-color: var(--bg-card);
            position: relative;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border-radius: 4px;
            max-width: 320px;
        }

        /* ─── Custom Modal Styles ─── */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .custom-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .custom-modal {
            background-color: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 90%;
            padding: 28px 28px 22px;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            color: var(--text-primary);
        }
        .custom-modal-overlay.active .custom-modal {
            transform: scale(1);
        }
        .custom-modal .modal-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
        }
        .custom-modal .modal-message {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .custom-modal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-btn {
            padding: 9px 20px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            border: 2px solid var(--border-input);
            background-color: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            letter-spacing: 0.02em;
        }
        .modal-btn:hover {
            background-color: var(--bg-table-row-hover);
            border-color: var(--accent);
        }
        .modal-btn.confirm-btn {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .modal-btn.confirm-btn:hover {
            background-color: var(--bg-button-hover);
            border-color: var(--bg-button-hover);
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="chart-card" id="tasksChartCard">
            <div class="chart-header">
                <p class="chart-title">
                    <span class="dot"></span> Tasks Report
                </p>
                <div class="filter-pills" id="tasksFilterPills">
                    <span class="filter-pill active" data-range="all">All Time</span>
                    <span class="filter-pill" data-range="day">Last Day</span>
                    <span class="filter-pill" data-range="week">Last Week</span>
                    <span class="filter-pill" data-range="month">Last Month</span>
                    <span class="filter-pill" data-range="year">Last Year</span>
                </div>
            </div>
            <div class="search-row">
                <div class="search-group">
                    <input type="text" id="taskNameSearch" placeholder="Search task name...">
                    <button class="search-btn" id="taskNameSearchBtn">🔍</button>
                </div>
                <div class="search-group">
                    <input type="text" id="createdBySearch" placeholder="Search created by...">
                    <button class="search-btn" id="createdBySearchBtn">🔍</button>
                </div>
                <button class="search-btn search-clear" id="tasksClearSearch">✕ Clear</button>
            </div>
            <div class="table-wrapper">
                <table class="chart-table" id="tasksReportTable">
                    <thead>
                        <tr>
                            <th>🆔 Task ID</th>
                            <th>📋 Task Name</th>
                            <th>📝 Description</th>
                            <th>📅 Start Date</th>
                            <th>📅 End Date</th>
                            <th>⏱️ Est. Hours</th>
                            <th>💰 Hourly Rate</th>
                            <th>👤 Created By</th>
                            <th>⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div class="empty-state hidden-el" id="tasksEmptyState">
                    <div class="empty-icon">📭</div>
                    <p>No tasks found</p>
                </div>
            </div>
            <div class="pagination-container" id="tasksPagination">
                <span class="pagination-info" id="tasksPaginationInfo">Showing 0 of 0 records</span>
                <div class="pagination-controls" id="tasksPaginationControls"></div>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div class="custom-modal-overlay" id="customConfirmModal">
        <div class="custom-modal">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <p class="modal-message" id="modalMessage">Are you sure?</p>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" id="modalCancel">Cancel</button>
                <button class="modal-btn confirm-btn" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ─── Dark mode sync with parent ───
            let darkLightMode = 'light';
            try {
                if (window.parent && window.parent.document) {
                    const parentBody = window.parent.document.querySelector("body");
                    if (parentBody && parentBody.classList.contains("dark-mode")) {
                        darkLightMode = 'dark';
                    }
                }
            } catch (e) { darkLightMode = 'light'; }

            if (darkLightMode === 'dark') document.body.classList.add('dark-mode');

            try {
                const parentBody = window.parent.document.querySelector("body");
                if (parentBody) {
                    const observer = new MutationObserver(() => {
                        const isDark = parentBody.classList.contains('dark-mode');
                        document.body.classList.toggle('dark-mode', isDark);
                    });
                    observer.observe(parentBody, { attributes: true, attributeFilter: ['class'] });
                }
            } catch (e) {}

            window.addEventListener('storage', function(e) {
                if (e.key === 'dashboardTheme') {
                    document.body.classList.toggle('dark-mode', e.newValue === 'dark');
                }
            });

            // ─── Toast helper ───
            function showToast(message, duration = 3000) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), duration);
            }

            // ─── Custom Confirmation Modal ───
            const modalOverlay = document.getElementById('customConfirmModal');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            const modalConfirm = document.getElementById('modalConfirm');
            const modalCancel = document.getElementById('modalCancel');

            let currentModalCallback = null; // stores the callback for confirm

            function showConfirmModal(message, icon = '⚠️', onConfirm) {
                modalMessage.textContent = message;
                modalIcon.textContent = icon;
                currentModalCallback = onConfirm;
                modalOverlay.classList.add('active');
            }

            function hideConfirmModal() {
                modalOverlay.classList.remove('active');
                currentModalCallback = null;
            }

            function dealWithActions()
            {
                
                
                if(document.getElementById("modalMessage").innerText.includes("Start task"))
                {
                    const text = document.getElementById("modalMessage").innerText;
                    let id = (text.match(/\d+/)[0]);
                    fetch('http://192.168.100.11:55952/changeTaskStatus', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            action: "67",
                            username: id,
                            password: "0"
                        })
                    });
                    location.reload();
                }
                else if(document.getElementById("modalMessage").innerText.includes("Mark task"))
                {
                    const text = document.getElementById("modalMessage").innerText;
                    let id = (text.match(/\d+/)[0]);
                    fetch('http://192.168.100.11:55952/changeTaskStatus', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            action: "67",
                            username: id,
                            password: "1"
                        })
                    });
                    location.reload();
                }
            
            
            }

            modalConfirm.addEventListener('click', () => {
                if (currentModalCallback) {
                    dealWithActions();
                    currentModalCallback();
                }
                hideConfirmModal();
            });

            modalCancel.addEventListener('click', hideConfirmModal);

            // Close modal on overlay click
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    hideConfirmModal();
                }
            });

            // ─── Global variables ───
            const ROWS_PER_PAGE = 20;
            let allTasksData = [];
            let currentFilter = 'all';
            let searchTaskName = '';
            let searchCreatedBy = '';
            let currentPage = 1;

            // ─── Filtering and search ───
            function filterByDateRange(data, dateField, range) {
                if (range === 'all') return data;
                const now = new Date();
                let cutoff;
                switch (range) {
                    case 'day': cutoff = new Date(now.getTime() - 24*60*60*1000); break;
                    case 'week': cutoff = new Date(now.getTime() - 7*24*60*60*1000); break;
                    case 'month': cutoff = new Date(now.getTime() - 30*24*60*60*1000); break;
                    case 'year': cutoff = new Date(now.getTime() - 365*24*60*60*1000); break;
                    default: return data;
                }
                return data.filter(item => {
                    try {
                        const d = new Date(item[dateField]);
                        return !isNaN(d.getTime()) && d >= cutoff;
                    } catch (e) { return true; }
                });
            }

            function applySearch(data) {
                if (!searchTaskName && !searchCreatedBy) return data;
                return data.filter(item => {
                    const taskName = (item.TASK_NAME || '').toString().toLowerCase();
                    const createdBy = (item.TASK_CREATED_BY || '').toString().toLowerCase();
                    let match = true;
                    if (searchTaskName) match = match && taskName.includes(searchTaskName.toLowerCase());
                    if (searchCreatedBy) match = match && createdBy.includes(searchCreatedBy.toLowerCase());
                    return match;
                });
            }

            function getPageData(data, page) {
                const start = (page - 1) * ROWS_PER_PAGE;
                const end = start + ROWS_PER_PAGE;
                return {
                    pageData: data.slice(start, end),
                    totalPages: Math.ceil(data.length / ROWS_PER_PAGE),
                    totalItems: data.length,
                    startIndex: data.length > 0 ? start + 1 : 0,
                    endIndex: Math.min(end, data.length),
                };
            }

            // ─── Action handlers using custom modal ───
            function startTask(taskId, taskName) {
                showConfirmModal(
                    `Start task "${taskName}" (ID: ${taskId})?`,
                    '▶️',
                    () => {
                        fetch('http://192.168.100.11:55952/startTask', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ taskId: taskId })
                        })
                        .then(response => {
                            if (!response.ok) throw new Error('Failed to start task');
                            return response.json();
                        })
                        .then(data => {
                            showToast(`✅ Task ${taskId} started successfully.`);
                        })
                        .catch(error => {
                            console.error('Error starting task:', error);
                            showToast('❌ Could not start task. Please try again.');
                        });
                    }
                );
            }

            function finishTask(taskId, taskName) {
                showConfirmModal(
                    `Mark task "${taskName}" (ID: ${taskId}) as finished and send for review?`,
                    '✅',
                    () => {
                        fetch('http://192.168.100.11:55952/finishTask', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ taskId: taskId })
                        })
                        .then(response => {
                            if (!response.ok) throw new Error('Failed to finish task');
                            return response.json();
                        })
                        .then(data => {
                            showToast(`✅ Task ${taskId} marked as finished. Sent for review.`);
                        })
                        .catch(error => {
                            console.error('Error finishing task:', error);
                            showToast('❌ Could not finish task. Please try again.');
                        });
                    }
                );
            }

            // ─── Render table ───
            function renderTasksTable() {
                let filtered = filterByDateRange(allTasksData, 'START_DATE_TIME', currentFilter);
                filtered = applySearch(filtered);
                const { pageData, totalPages, totalItems, startIndex, endIndex } = getPageData(filtered, currentPage);

                const tbody = document.querySelector('#tasksReportTable tbody');
                const emptyState = document.getElementById('tasksEmptyState');
                tbody.innerHTML = '';

                if (pageData.length === 0) {
                    emptyState.classList.remove('hidden-el');
                } else {
                    emptyState.classList.add('hidden-el');
                }

                pageData.forEach(task => {
                    const row = tbody.insertRow();
                    const taskId = task.TASKS_ID ?? '—';

                    row.insertCell(0).textContent = taskId;
                    row.insertCell(1).textContent = task.TASK_NAME || '—';
                    
                    const descCell = row.insertCell(2);
                    descCell.textContent = task.TASK_DESCRIPTION || '—';
                    descCell.classList.add('description-cell');
                    descCell.title = task.TASK_DESCRIPTION || '';

                    row.insertCell(3).textContent = task.START_DATE_TIME || '—';
                    row.insertCell(4).textContent = task.END_DATE_TIME || '—';
                    
                    const hours = task.EST_HOURS_IT_WILL_TAKE;
                    row.insertCell(5).textContent = hours != null ? parseFloat(hours).toFixed(2) : '—';
                    
                    const rate = task.HOURLY_RATE_FOR_TASK;
                    row.insertCell(6).textContent = rate != null ? '$' + parseFloat(rate).toFixed(2) : '—';
                    
                    row.insertCell(7).textContent = task.TASK_CREATED_BY || '—';

                    // Action cell
                    const actionCell = row.insertCell(8);
                    actionCell.classList.add('action-cell');
                    actionCell.innerHTML = `
                        <button class="btn-row-action btn-start" data-taskid="${taskId}" data-taskname="${task.TASK_NAME || ''}">▶ Start</button>
                        <button class="btn-row-action btn-finish" data-taskid="${taskId}" data-taskname="${task.TASK_NAME || ''}">✅ Finish</button>
                    `;

                    // Add event listeners
                    const startBtn = actionCell.querySelector('.btn-start');
                    const finishBtn = actionCell.querySelector('.btn-finish');
                    startBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startTask(taskId, task.TASK_NAME || '');
                    });
                    finishBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        finishTask(taskId, task.TASK_NAME || '');
                    });
                });

                renderPagination(currentPage, totalPages, totalItems, startIndex, endIndex);
            }

            // ─── Pagination rendering ───
            function renderPagination(currentPage, totalPages, totalItems, startIndex, endIndex) {
                const container = document.getElementById('tasksPaginationControls');
                const infoEl = document.getElementById('tasksPaginationInfo');
                container.innerHTML = '';
                infoEl.textContent = `Showing ${startIndex}–${endIndex} of ${totalItems} record${totalItems !== 1 ? 's' : ''}`;

                if (totalPages <= 1) {
                    const btn = document.createElement('button');
                    btn.className = 'pagination-btn active';
                    btn.textContent = '1';
                    btn.disabled = true;
                    container.appendChild(btn);
                    return;
                }

                const leftArrow = document.createElement('button');
                leftArrow.className = 'pagination-btn pagination-arrow';
                leftArrow.textContent = '‹';
                leftArrow.disabled = currentPage === 1;
                leftArrow.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTasksTable();
                        document.getElementById('tasksChartCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                container.appendChild(leftArrow);

                const maxVisible = 7;
                let pages = [];
                if (totalPages <= maxVisible) {
                    for (let i = 1; i <= totalPages; i++) pages.push(i);
                } else {
                    pages.push(1);
                    let startPage = Math.max(2, currentPage - 2);
                    let endPage = Math.min(totalPages - 1, currentPage + 2);
                    if (currentPage <= 3) { startPage = 2; endPage = 5; }
                    if (currentPage >= totalPages - 2) { startPage = totalPages - 4; endPage = totalPages - 1; }
                    if (startPage > 2) pages.push('...');
                    for (let i = startPage; i <= endPage; i++) pages.push(i);
                    if (endPage < totalPages - 1) pages.push('...');
                    pages.push(totalPages);
                }

                pages.forEach(p => {
                    if (p === '...') {
                        const ellipsis = document.createElement('span');
                        ellipsis.className = 'pagination-ellipsis';
                        ellipsis.textContent = '…';
                        container.appendChild(ellipsis);
                    } else {
                        const btn = document.createElement('button');
                        btn.className = 'pagination-btn';
                        if (p === currentPage) btn.classList.add('active');
                        btn.textContent = p;
                        btn.addEventListener('click', () => {
                            currentPage = p;
                            renderTasksTable();
                            document.getElementById('tasksChartCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        });
                        container.appendChild(btn);
                    }
                });

                const rightArrow = document.createElement('button');
                rightArrow.className = 'pagination-btn pagination-arrow';
                rightArrow.textContent = '›';
                rightArrow.disabled = currentPage === totalPages;
                rightArrow.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderTasksTable();
                        document.getElementById('tasksChartCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                container.appendChild(rightArrow);
            }

            // ─── Fetch data ───
            async function fetchTasksData() {
                try {
                    const response = await fetch('http://192.168.100.11:55952/tasksReportAPI', { method: 'POST' });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    allTasksData = Array.isArray(data) ? data : [];
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                    showToast('⚠️ Failed to load tasks. Please try again.');
                    allTasksData = [];
                }
                currentPage = 1;
                renderTasksTable();
            }

            // ─── Filter pills ───
            document.getElementById('tasksFilterPills').querySelectorAll('.filter-pill').forEach(pill => {
                pill.addEventListener('click', function() {
                    const container = document.getElementById('tasksFilterPills');
                    container.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-range');
                    currentPage = 1;
                    renderTasksTable();
                });
            });

            // ─── Search handlers ───
            document.getElementById('taskNameSearchBtn').addEventListener('click', () => {
                searchTaskName = document.getElementById('taskNameSearch').value.trim();
                currentPage = 1;
                renderTasksTable();
            });
            document.getElementById('createdBySearchBtn').addEventListener('click', () => {
                searchCreatedBy = document.getElementById('createdBySearch').value.trim();
                currentPage = 1;
                renderTasksTable();
            });
            document.getElementById('tasksClearSearch').addEventListener('click', () => {
                document.getElementById('taskNameSearch').value = '';
                document.getElementById('createdBySearch').value = '';
                searchTaskName = '';
                searchCreatedBy = '';
                currentPage = 1;
                renderTasksTable();
            });
            document.getElementById('taskNameSearch').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    searchTaskName = e.target.value.trim();
                    currentPage = 1;
                    renderTasksTable();
                }
            });
            document.getElementById('createdBySearch').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    searchCreatedBy = e.target.value.trim();
                    currentPage = 1;
                    renderTasksTable();
                }
            });

            // ─── Initial load ───
            fetchTasksData();
        })();
    </script>
</body>
</html>
