<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Warehouse Management</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-table-header: #f1f5f9;
            --bg-table-row-even: #fafbfc;
            --bg-table-row-hover: #eef2ff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-input: #1e293b;
            --border-card: #dde4ef;
            --border-input: #d5dce8;
            --border-table: #e2e8f0;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.05);
            --accent: #4a6fa5;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --transition: 0.2s ease;
        }
        body.dark-mode {
            --bg-body: #171a21;
            --bg-card: #1e2128;
            --bg-input: #252830;
            --bg-table-header: #252830;
            --bg-table-row-even: #1f2229;
            --bg-table-row-hover: #282d38;
            --text-primary: #e2e6ec;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --text-input: #e2e6ec;
            --border-card: #2e333d;
            --border-input: #3a404d;
            --border-table: #2a2f3a;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-primary); height: 100vh; display: flex; transition: background 0.3s; }
        button { cursor: pointer; border: none; background: none; font-size: inherit; }
        input, select { font-size: 0.9rem; }

        .app-container { display: flex; width: 100%; height: 100%; overflow: hidden; }
        .table-area { flex: 1; min-width: 0; transition: flex 0.3s; display: flex; flex-direction: column; padding: 16px; }
        .form-panel { width: 0; overflow: hidden; background: var(--bg-card); border-left: 1px solid var(--border-card); transition: width 0.3s; display: flex; flex-direction: column; }
        .form-panel.open { width: 50%; min-width: 300px; padding: 20px; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .mode-buttons { display: flex; gap: 6px; }
        .mode-buttons button {
            padding: 8px 16px; border: 1px solid var(--border-input); border-radius: var(--radius-sm);
            background: var(--bg-card); color: var(--text-primary); font-weight: 600;
        }
        .mode-buttons button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button {
            background: var(--bg-input); border: 1px solid var(--border-input);
            border-radius: var(--radius-sm); padding: 8px 14px; font-weight: 600;
            display: flex; align-items: center; gap: 6px; transition: all var(--transition);
        }
        .action-btns button:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
        .action-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

        .search-wrapper { position: relative; flex: 1; max-width: 280px; }
        .search-wrapper input {
            width: 100%; padding: 8px 36px 8px 14px;
            border: 1px solid var(--border-input); border-radius: var(--radius-sm);
            background: var(--bg-input); color: var(--text-input);
        }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .table-wrapper { flex: 1; overflow-y: auto; border: 1px solid var(--border-table); border-radius: var(--radius-md); background: var(--bg-card); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: var(--bg-table-header); padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border-table); }
        tbody tr:nth-child(even) { background: var(--bg-table-row-even); }
        tbody tr:hover { background: var(--bg-table-row-hover); }
        .radio-cell { width: 40px; text-align: center; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .pagination button { padding: 6px 12px; border: 1px solid var(--border-input); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary); }
        .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .pagination button:disabled { opacity: 0.4; }

        .form-panel h3 { margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group .type-selector {
            width: 100%; padding: 10px;
            border: 1px solid var(--border-input); border-radius: var(--radius-sm);
            background: var(--bg-input); color: var(--text-input);
        }
        .type-selector { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .type-selector span { flex: 1; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: var(--radius-sm); }
        .btn-secondary { background: var(--bg-input); border: 1px solid var(--border-input); padding: 10px 20px; border-radius: var(--radius-sm); color: var(--text-primary); }
        .close-btn { background: none; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--text-muted); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-content { background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px; min-width: 320px; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .confirm-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

        /* Map container */
        .map-container { height: 220px; border: 1px solid var(--border-input); border-radius: var(--radius-sm); margin-bottom: 8px; }
        .coord-display { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }

        .toast { position: fixed; bottom: 30px; right: 30px; background: #1e293b; color: #fff; padding: 10px 20px; border-radius: var(--radius-sm); z-index: 2000; opacity: 0; transition: 0.3s; }
        .toast.show { opacity: 1; }
        body.dark-mode .toast { background: #f1f5f9; color: #1e293b; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="table-area" id="tableArea">
        <div class="toolbar">
            <div class="mode-buttons">
                <button id="modeTypesBtn" class="active">Location Types</button>
                <button id="modeLocationsBtn">Locations</button>
            </div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
            <div class="action-btns">
                <button id="addBtn" title="Add new"><span>➕</span> Add</button>
                <button id="editBtn" disabled title="Edit selected"><span>✏️</span> Edit</button>
                <button id="deleteBtn" disabled title="Delete selected"><span>🗑️</span> Delete</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="form-panel" id="formPanel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="formTitle">New Item</h3>
            <button class="close-btn" id="closeFormBtn">✖</button>
        </div>
        <div id="formFields" style="flex:1; overflow-y:auto;"></div>
        <div class="form-actions">
            <button class="btn-secondary" id="cancelFormBtn">Cancel</button>
            <button class="btn-primary" id="saveFormBtn">Save</button>
        </div>
    </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-content">
        <div class="modal-header">
            <h4>Confirm Deletion</h4>
            <button class="close-btn" id="closeDeleteModalBtn">✖</button>
        </div>
        <p>Are you sure you want to delete <strong id="deleteItemName"></strong>?</p>
        <div class="confirm-buttons">
            <button class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
            <button class="btn-primary" id="confirmDeleteBtn" style="background: #e74c3c;">Delete</button>
        </div>
    </div>
</div>

<!-- Location type selection modal -->
<div class="modal-overlay" id="typeModal">
    <div class="modal-content">
        <div class="modal-header">
            <h4>Select Location Type</h4>
            <button class="close-btn" id="closeTypeModalBtn">✖</button>
        </div>
        <div style="max-height: 300px; overflow-y: auto;">
            <table id="typeModalTable">
                <thead><tr><th></th><th>ID</th><th>Type Title</th></tr></thead>
                <tbody id="typeModalBody"></tbody>
            </table>
        </div>
        <div class="confirm-buttons">
            <button class="btn-secondary" id="cancelTypeSelectBtn">Cancel</button>
            <button class="btn-primary" id="confirmTypeSelectBtn">Select</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    (() => {
        // ── Dark mode sync ──
        function getDarkModeState() {
            try {
                if (parent && parent.document) {
                    const pBody = parent.document.querySelector('body');
                    if (pBody) return pBody.classList.contains('dark-mode');
                }
            } catch(e) {}
            return document.body.classList.contains('dark-mode');
        }
        function applyDarkMode() { document.body.classList.toggle('dark-mode', getDarkModeState()); }
        applyDarkMode();
        try {
            if (parent && parent.document) {
                const pBody = parent.document.querySelector('body');
                if (pBody) new MutationObserver(applyDarkMode).observe(pBody, {attributes: true, attributeFilter: ['class']});
            }
        } catch(e) {}

        const API_BASE = window.location.origin;
        const rowsPerPage = 20;

        // State
        let currentMode = 'types';
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        let selectedRowIndex = -1;
        let editMode = false;
        let originalItem = null;

        // Map related
        let formMap = null;
        let formMarker = null;
        let currentLat = null;
        let currentLng = null;

        // DOM elements
        const tableBody = document.getElementById('tableBody');
        const tableHead = document.getElementById('tableHead');
        const pagination = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const addBtn = document.getElementById('addBtn');
        const editBtn = document.getElementById('editBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const formPanel = document.getElementById('formPanel');
        const formTitle = document.getElementById('formTitle');
        const formFields = document.getElementById('formFields');
        const saveFormBtn = document.getElementById('saveFormBtn');
        const cancelFormBtn = document.getElementById('cancelFormBtn');
        const closeFormBtn = document.getElementById('closeFormBtn');
        const deleteModal = document.getElementById('deleteModal');
        const deleteItemName = document.getElementById('deleteItemName');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const closeDeleteModalBtn = document.getElementById('closeDeleteModalBtn');
        const typeModal = document.getElementById('typeModal');
        const typeModalBody = document.getElementById('typeModalBody');
        const confirmTypeSelectBtn = document.getElementById('confirmTypeSelectBtn');
        const cancelTypeSelectBtn = document.getElementById('cancelTypeSelectBtn');
        const closeTypeModalBtn = document.getElementById('closeTypeModalBtn');
        const toast = document.getElementById('toast');
        const modeTypesBtn = document.getElementById('modeTypesBtn');
        const modeLocationsBtn = document.getElementById('modeLocationsBtn');

        // Temp storage for location type selection
        let selectedTypeId = null;
        let selectedTypeTitle = '';

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── Data fetching ───
        async function fetchData() {
            const url = currentMode === 'types' ? '/inventoryLocationTypesAPI' : '/inventoryLocationsReadableAPI';
            const res = await fetch(API_BASE + url, { method: 'POST' });
            if (!res.ok) throw new Error('Failed to fetch data');
            const data = await res.json();
            allData = Array.isArray(data) ? data : [];
            filterAndPaginate();
        }

        function filterAndPaginate() {
            const query = searchInput.value.toLowerCase().trim();
            filteredData = allData.filter(item =>
                Object.values(item).some(val => val != null && String(val).toLowerCase().includes(query))
            );
            currentPage = 1;
            selectedRowIndex = -1;
            updateActionButtons();
            renderTable();
            renderPagination();
        }

        function getTableColumns() {
            return currentMode === 'types'
                ? ['LT_INVENTORY_LOCATION_TYPE_ID', 'INVENTORY_LOCATION_TYPE_TITLE']
                : ['INVENTORY_LOCATION_ID', 'INVENTORY_LOCATION_NAME', 'INVENTORY_LOCATION_ADDRESS',
                   'INVENTORY_LOCATION_LAT', 'INVENTORY_LOCATION_LONG', 'INVENTORY_LOCATION_TYPE_TITLE'];
        }

        function renderTableHead() {
            const cols = getTableColumns();
            let html = '<tr><th></th>';
            cols.forEach(col => {
                const label = col.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                html += `<th>${label}</th>`;
            });
            html += '</tr>';
            tableHead.innerHTML = html;
        }

        function renderTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const pageItems = filteredData.slice(start, start + rowsPerPage);
            const cols = getTableColumns();
            let html = '';
            pageItems.forEach((item, idx) => {
                const globalIndex = start + idx;
                html += `<tr>
                    <td class="radio-cell"><input type="radio" name="dataSelect" value="${globalIndex}" ${globalIndex === selectedRowIndex ? 'checked' : ''}></td>`;
                cols.forEach(col => {
                    html += `<td>${escapeHtml(item[col] != null ? item[col] : '')}</td>`;
                });
                html += '</tr>';
            });
            tableBody.innerHTML = html || `<tr><td colspan="${cols.length+1}" style="text-align:center;padding:20px;">No data found.</td></tr>`;

            document.querySelectorAll('input[name="dataSelect"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    selectedRowIndex = parseInt(this.value);
                    updateActionButtons();
                });
            });

            if (selectedRowIndex >= start && selectedRowIndex < start + rowsPerPage) {
                const radio = document.querySelector(`input[name="dataSelect"][value="${selectedRowIndex}"]`);
                if (radio) radio.checked = true;
            }
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
            let html = '';
            html += `<button ${currentPage === 1 ? 'disabled' : ''} data-page="prev">← Prev</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="next">Next →</button>`;
            pagination.innerHTML = html;
            pagination.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    if (page === 'prev' && currentPage > 1) currentPage--;
                    else if (page === 'next' && currentPage < totalPages) currentPage++;
                    else if (!isNaN(page)) currentPage = parseInt(page);
                    renderTable();
                    renderPagination();
                });
            });
        }

        function updateActionButtons() {
            const valid = selectedRowIndex >= 0 && selectedRowIndex < filteredData.length;
            editBtn.disabled = !valid;
            deleteBtn.disabled = !valid;
        }

        // ─── Form handling ───
        function openForm(title, edit = false, item = null) {
            formPanel.classList.add('open');
            formTitle.textContent = title;
            editMode = edit;
            originalItem = item ? {...item} : null;
            buildFormFields(item);
        }

        function closeForm() {
            if (formMap) {
                formMap.remove();
                formMap = null;
                formMarker = null;
            }
            formPanel.classList.remove('open');
            formFields.innerHTML = '';
            editMode = false;
            originalItem = null;
            currentLat = null;
            currentLng = null;
            selectedTypeId = null;
            selectedTypeTitle = '';
        }

        function buildFormFields(item) {
            let html = '';
            if (currentMode === 'types') {
                html += `<div class="form-group">
                    <label>Type Title</label>
                    <input type="text" id="typeTitleInput" placeholder="Enter type title" value="${item ? escapeHtml(item.INVENTORY_LOCATION_TYPE_TITLE || '') : ''}">
                </div>`;
            } else {
                // Location fields: name, address, map, type selector
                html += `<div class="form-group">
                    <label>Name</label>
                    <input type="text" id="locNameInput" placeholder="Enter location name" value="${item ? escapeHtml(item.INVENTORY_LOCATION_NAME || '') : ''}">
                </div>`;
                html += `<div class="form-group">
                    <label>Address</label>
                    <input type="text" id="locAddressInput" placeholder="Enter address" value="${item ? escapeHtml(item.INVENTORY_LOCATION_ADDRESS || '') : ''}">
                </div>`;
                html += `<div class="form-group">
                    <label>Pick Location on Map</label>
                    <div id="mapContainer" class="map-container"></div>
                    <div class="coord-display">Lat: <span id="latDisplay">${item ? item.INVENTORY_LOCATION_LAT : '—'}</span>, Lng: <span id="lngDisplay">${item ? item.INVENTORY_LOCATION_LONG : '—'}</span></div>
                </div>`;
                // Type selector
                selectedTypeId = item ? (item.LT_INVENTORY_LOCATION_TYPE_ID || null) : null;
                selectedTypeTitle = item ? (item.INVENTORY_LOCATION_TYPE_TITLE || '') : '';
                html += `<div class="form-group">
                    <label>Location Type</label>
                    <div class="type-selector" id="typeSelectorBtn">
                        <span id="selectedTypeText">${selectedTypeTitle || 'Click to select...'}</span>
                        <button type="button">📋</button>
                    </div>
                </div>`;
            }
            formFields.innerHTML = html;

            if (currentMode === 'locations') {
                document.getElementById('typeSelectorBtn').addEventListener('click', openTypeModal);
                // Initialize map after the container is in the DOM and panel is visible
                setTimeout(() => {
                    initMap(item);
                }, 300); // wait for CSS transition
            }
        }

        function initMap(item) {
            const container = document.getElementById('mapContainer');
            if (!container) return;

            // Destroy previous map if any
            if (formMap) {
                formMap.remove();
                formMap = null;
            }

            // Default coordinates (Tehran) or from item
            const defLat = 35.6892;
            const defLng = 51.3890;
            const startLat = item ? parseFloat(item.INVENTORY_LOCATION_LAT) || defLat : defLat;
            const startLng = item ? parseFloat(item.INVENTORY_LOCATION_LONG) || defLng : defLng;
            currentLat = startLat;
            currentLng = startLng;

            formMap = L.map(container).setView([startLat, startLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(formMap);

            formMarker = L.marker([startLat, startLng], { draggable: true }).addTo(formMap)
                .bindPopup('Drag me or click the map').openPopup();

            // Update coordinates display
            function updateCoord(lat, lng) {
                currentLat = lat;
                currentLng = lng;
                document.getElementById('latDisplay').textContent = lat.toFixed(6);
                document.getElementById('lngDisplay').textContent = lng.toFixed(6);
            }

            formMap.on('click', function(e) {
                formMarker.setLatLng(e.latlng);
                updateCoord(e.latlng.lat, e.latlng.lng);
            });

            formMarker.on('dragend', function() {
                const pos = formMarker.getLatLng();
                updateCoord(pos.lat, pos.lng);
            });

            // Force map to recalculate size (it's in a transitioning panel)
            setTimeout(() => {
                formMap.invalidateSize();
            }, 100);
        }

        async function saveForm() {
            if (currentMode === 'types') {
                await saveLocationType();
            } else {
                await saveLocation();
            }
        }

        async function saveLocationType() {
            const title = document.getElementById('typeTitleInput').value.trim();
            if (!title) return showToast('Title is required.');

            let action = editMode && originalItem ? 'MODIFY_INVENTORY_TYPE' : 'ADD_INVENTORY_TYPE';
            const payload = {
                action: action,
                inventoryLocationTitle: editMode ? originalItem.INVENTORY_LOCATION_TYPE_TITLE : title,
                newInventoryLocationTitle: editMode ? title : "",
                productsName: "",
                newProductsName: "",
                productsCategoryId: 0,
                productsCategoryName: "",
                newProductsCategoryName: ""
            };

            try {
                const res = await fetch(API_BASE + '/manageInventoryInfstructureAPI', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Operation failed');
                showToast(editMode ? 'Type updated.' : 'Type added.');
                closeForm();
                await fetchData();
            } catch(e) {
                console.error(e);
                showToast('Operation failed.');
            }
        }

        async function saveLocation() {
            const nameInput = document.getElementById('locNameInput');
            const addrInput = document.getElementById('locAddressInput');
            const name = nameInput ? nameInput.value.trim() : '';
            const address = addrInput ? addrInput.value.trim() : '';

            // Validation: create must have all fields, update can send nulls
            if (!editMode) {
                if (!name || !address || currentLat == null || currentLng == null) {
                    return showToast('Name, address, and map coordinates are required.');
                }
                if (selectedTypeId == null) {
                    return showToast('Please select a location type.');
                }
            }

            const action = editMode ? 'UPDATE_INVENTORY_LOCATION' : 'CREATE_INVENTORY_LOCATION';
            const locationId = editMode && originalItem ? originalItem.INVENTORY_LOCATION_ID : 0;

            // For update, send null if field is empty (to preserve existing values)
            const payload = {
                action: action,
                inventoryLocationId: locationId,
                inventoryLocationName: editMode ? (name || null) : name,
                inventoryLocationAddress: editMode ? (address || null) : address,
                inventoryLocationLat: (editMode && currentLat == null) ? null : currentLat,
                inventoryLocationLong: (editMode && currentLng == null) ? null : currentLng,
                ltInventoryLocationTypeId: (editMode && selectedTypeId == null) ? null : selectedTypeId
            };

            try {
                const res = await fetch(API_BASE + '/createUpdateDeleteInventoryLocationAPI', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Operation failed');
                showToast(editMode ? 'Location updated.' : 'Location added.');
                closeForm();
                await fetchData();
            } catch(e) {
                console.error(e);
                showToast('Operation failed.');
            }
        }

        // ─── Type selection modal ───
        async function openTypeModal() {
            try {
                const res = await fetch(API_BASE + '/inventoryLocationTypesAPI', { method: 'POST' });
                if (!res.ok) throw new Error('Failed to load types');
                const types = await res.json();
                let html = '';
                types.forEach(t => {
                    html += `<tr>
                        <td class="radio-cell"><input type="radio" name="typeSelect" value="${t.LT_INVENTORY_LOCATION_TYPE_ID}" data-title="${escapeHtml(t.INVENTORY_LOCATION_TYPE_TITLE)}" ${t.LT_INVENTORY_LOCATION_TYPE_ID == selectedTypeId ? 'checked' : ''}></td>
                        <td>${t.LT_INVENTORY_LOCATION_TYPE_ID}</td>
                        <td>${escapeHtml(t.INVENTORY_LOCATION_TYPE_TITLE)}</td>
                    </tr>`;
                });
                typeModalBody.innerHTML = html || '<tr><td colspan="3">No types found.</td></tr>';
                typeModal.classList.add('active');
            } catch(e) {
                showToast('Could not load location types.');
            }
        }

        function closeTypeModal(save) {
            if (save) {
                const checked = document.querySelector('input[name="typeSelect"]:checked');
                if (checked) {
                    selectedTypeId = parseInt(checked.value);
                    selectedTypeTitle = checked.dataset.title;
                    document.getElementById('selectedTypeText').textContent = selectedTypeTitle;
                }
            }
            typeModal.classList.remove('active');
        }

        confirmTypeSelectBtn.addEventListener('click', () => closeTypeModal(true));
        cancelTypeSelectBtn.addEventListener('click', () => closeTypeModal(false));
        closeTypeModalBtn.addEventListener('click', () => closeTypeModal(false));
        window.addEventListener('click', (e) => { if (e.target === typeModal) closeTypeModal(false); });

        // ─── Delete handling ───
        function promptDelete() {
            if (selectedRowIndex < 0) return;
            const item = filteredData[selectedRowIndex];
            const name = currentMode === 'types' ? item.INVENTORY_LOCATION_TYPE_TITLE : item.INVENTORY_LOCATION_NAME;
            deleteItemName.textContent = name;
            deleteModal.classList.add('active');
        }

        async function performDelete() {
            if (selectedRowIndex < 0) return;
            const item = filteredData[selectedRowIndex];
            try {
                if (currentMode === 'types') {
                    const payload = {
                        action: 'DELETE_INVENTORY_TYPE',
                        inventoryLocationTitle: item.INVENTORY_LOCATION_TYPE_TITLE,
                        newInventoryLocationTitle: "",
                        productsName: "",
                        newProductsName: "",
                        productsCategoryId: 0,
                        productsCategoryName: "",
                        newProductsCategoryName: ""
                    };
                    await fetch(API_BASE + '/manageInventoryInfstructureAPI', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    const payload = {
                        action: 'DELETE_INVENTORY_LOCATION',
                        inventoryLocationId: item.INVENTORY_LOCATION_ID,
                        inventoryLocationName: "",
                        inventoryLocationAddress: "",
                        inventoryLocationLat: "",
                        inventoryLocationLong: "",
                        ltInventoryLocationTypeId: 0
                    };
                    await fetch(API_BASE + '/createUpdateDeleteInventoryLocationAPI', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                showToast('Item deleted.');
                deleteModal.classList.remove('active');
                await fetchData();
            } catch(e) {
                console.error(e);
                showToast('Deletion failed.');
            }
        }

        confirmDeleteBtn.addEventListener('click', performDelete);
        cancelDeleteBtn.addEventListener('click', () => deleteModal.classList.remove('active'));
        closeDeleteModalBtn.addEventListener('click', () => deleteModal.classList.remove('active'));
        window.addEventListener('click', (e) => { if (e.target === deleteModal) deleteModal.classList.remove('active'); });

        // ─── Mode switching ───
        function switchMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            modeTypesBtn.classList.toggle('active', mode === 'types');
            modeLocationsBtn.classList.toggle('active', mode === 'locations');
            closeForm();
            fetchData().then(() => {
                renderTableHead();
                renderTable();
                renderPagination();
            });
        }

        modeTypesBtn.addEventListener('click', () => switchMode('types'));
        modeLocationsBtn.addEventListener('click', () => switchMode('locations'));

        // ─── Event listeners ───
        searchInput.addEventListener('input', filterAndPaginate);
        addBtn.addEventListener('click', () => openForm('New ' + (currentMode === 'types' ? 'Type' : 'Location'), false));
        editBtn.addEventListener('click', () => {
            if (selectedRowIndex < 0) return;
            const item = filteredData[selectedRowIndex];
            openForm('Edit ' + (currentMode === 'types' ? 'Type' : 'Location'), true, item);
        });
        deleteBtn.addEventListener('click', promptDelete);
        closeFormBtn.addEventListener('click', closeForm);
        cancelFormBtn.addEventListener('click', closeForm);
        saveFormBtn.addEventListener('click', saveForm);

        // Initial load
        fetchData().then(() => {
            renderTableHead();
            renderTable();
            renderPagination();
        });
    })();
</script>
</body>
</html>
