<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drivers</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Drivers</h1>
        <p>Manage driver records.</p>
    </div>

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="201"

            api="http://127.0.0.1:8080/driversApi"

            table-id="driversTable"

            caption="Drivers"

            classes="blue neon pastel dark"

            inputs="
                |name::drivers_code|title::Driver Code|type::number|value::;;
                |name::drivers_first_name|title::First Name|type::text|value::;;
                |name::drivers_last_name|title::Last Name|type::text|value::;;
                |name::drivers_national_code|title::National Code|type::text|value::;;
                |name::drivers_phone_number|title::Phone|type::text|value::;;
                |name::drivers_age|title::Age|type::number|value::;;
            "

            columns="
                Driver Code,
                First Name,
                Last Name,
                National Code,
                Phone,
                Age
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
