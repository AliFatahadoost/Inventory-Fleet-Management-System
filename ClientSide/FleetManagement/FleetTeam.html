<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fleet Team</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Fleet Team</h1>
        <p>Define and manage fleet teams.</p>
    </div>

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="200"

            api="http://127.0.0.1:8080/fleetTeamApi"

            table-id="fleetTeamTable"

            caption="Fleet Teams"

            classes="blue neon pastel dark"

            inputs="
                |name::fleet_team_code|title::Team Code|type::number|value::;;
                |name::fleet_team_name|title::Team Name|type::text|value::;;
            "

            columns="
                Team Code,
                Team Name
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
