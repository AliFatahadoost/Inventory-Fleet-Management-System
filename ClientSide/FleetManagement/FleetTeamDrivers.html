<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Drivers</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Team Drivers</h1>
        <p>Assign drivers and vehicles to fleet teams.</p>
    </div>

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="203"

            api="http://127.0.0.1:8080/fleetTeamDriversApi"

            table-id="fleetTeamDriversTable"

            caption="Team Drivers"

            classes="blue neon pastel dark"

            inputs="
                |name::fleet_team_id|title::Fleet Team|type::data-combo|value::|api::http://127.0.0.1:8080/fleetTeamLookupApi;;
                |name::driver_code|title::Driver|type::data-combo|value::|api::http://127.0.0.1:8080/driversLookupApi;;
                |name::vehicle_code|title::Vehicle|type::data-combo|value::|api::http://127.0.0.1:8080/vehiclesLookupApi;;
            "

            columns="
                Fleet Team,
                Driver,
                Vehicle
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
