<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Managers</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Team Managers</h1>
        <p>Assign users as fleet team managers.</p>
    </div>

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="204"

            api="http://127.0.0.1:8080/fleetTeamManagerApi"

            table-id="fleetTeamManagerTable"

            caption="Team Managers"

            classes="blue neon pastel dark"

            inputs="
                |name::fleet_team_manager_code|title::Manager Code|type::number|value::;;
                |name::user_id|title::User|type::find-object-box|value::|api::http://127.0.0.1:8080/usersPickerApi|columns::Username;;
                |name::fleet_team_code|title::Fleet Team|type::find-object-box|value::|api::http://127.0.0.1:8080/fleetTeamPickerApi|columns::Code,Name;;
            "

            columns="
                Manager Code,
                User,
                Fleet Team
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
