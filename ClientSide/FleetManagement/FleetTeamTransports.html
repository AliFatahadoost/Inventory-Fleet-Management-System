<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Transports</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Team Transports</h1>
        <p>Assign drivers and vehicles to product requests.</p>
    </div>

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="207"

            api="http://127.0.0.1:8080/fleetTeamTransportsApi"

            table-id="fleetTeamTransportsTable"

            caption="Team Transports"

            classes="blue neon pastel dark"

            inputs="
                |name::inventory_product_request_header_id|title::Product Request|type::find-object-box|value::|api::http://127.0.0.1:8080/productRequestHeaderPickerApi|columns::Type,Status,Date;;
                |name::assigned_driver_code|title::Driver|type::find-object-box|value::|api::http://127.0.0.1:8080/driversPickerApi|columns::Name,Phone;;
                |name::assigned_vehicle_code|title::Vehicle|type::find-object-box|value::|api::http://127.0.0.1:8080/vehiclesPickerApi|columns::Name,Plate;;
            "

            columns="
                Request Ref,
                Driver,
                Vehicle
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
