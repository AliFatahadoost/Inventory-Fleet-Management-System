<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fleet Trips</title>

    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

    <style>
        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
    </style>

</head>

<body>

    <div class="page-header">
        <h1>Fleet Trips</h1>
        <p>Pick a product request — origin and destination fill automatically, and the route is computed via OSRM.</p>
    </div>

    <div class="table-container">

        <fleet-trip-table

            data-AccessCode="205"

            api="http://127.0.0.1:8080/fleetTripApi"

            table-id="fleetTripTable"

            caption="Fleet Trips"

            classes="blue neon pastel dark"

        >
        </fleet-trip-table>

    </div>

</body>

</html>
