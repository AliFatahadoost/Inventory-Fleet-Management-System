<body>   
  <script type="module" src="http://127.0.0.1:8080/coreJs"></script>

         <!-- title is id, name is api endpoint and type is data-combo -->

  <jali-form
    title="Login"
    api="http://127.0.0.1:8080/Login"
    btn-count="2"
    btn-names="Login Exit"
    classes="dark-red neon pastel dark"
    inputs="
        |name::USERNAME|title::username|type::text|value::;;
        |name::PASSWORD|title::Password|type::Password|value::;;
    "
></jali-form>
  
  
  <date-box></date-box>
  
  <fetch-data-table
    api="http://127.0.0.1:8080/fakeTable"
    table-id="myTable1"
    caption="users"
    classes="dark-purple pastel small dark"
    inputs="|name::username|title::username|type::text|value::;;
            |name::http://127.0.0.1:8080/fakeTable?s=40&a1=1&a2&a3&a4|title::country|type::data-combo|value::;;
            |name::http://127.0.0.1:8080/fakeTable|title::date|type::date-box|value::;;"
    columns="username,country,password">
  </fetch-data-table>
  <data-combo
      title="Country"
      name="http://127.0.0.1:8080/fakeTable?s=40&a1=1&a2&a3&a4">
  </data-combo>
  <find-object-box
    title="Select User"
    name="http://127.0.0.1:8080/fakeTable"
    value="username,country,password">
  </find-object-box>
