
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory Management</title>

    <!-- Jali -->
    <script
        type="module"
        src="http://127.0.0.1:8080/coreJs">
    </script>

    <style>

        :root {
            --background: #f8fafc;
            --card-background: #ffffff;
            --text: #1e293b;
            --secondary-text: #64748b;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 18px rgba(0, 0, 0, 0.12);
            --accent: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 30px;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: var(--background);
            color: var(--text);
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            color: var(--secondary-text);
            font-size: 1rem;
        }

        /* =====================================================
           FORM GRID
           ===================================================== */

        .forms-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 18px;
        }

        /* =====================================================
           FORM CARD
           ===================================================== */

        .form-card {
            width: 100%;
            min-height: 150px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;

            padding: 22px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background-color:
                var(--card-background);

            color: var(--text);

            box-shadow:
                var(--shadow);

            cursor: pointer;

            text-align: left;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background-color 0.15s ease;
        }

        .form-card:hover {
            transform: translateY(-2px);

            background-color:
                var(--hover);

            box-shadow:
                var(--shadow-hover);
        }

        .form-card:active {
            transform: translateY(0);
        }

        .form-icon {
            margin-bottom: 14px;
            font-size: 2.1rem;
        }

        .form-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .form-description {
            margin-top: 6px;

            color:
                var(--secondary-text);

            font-size: 0.88rem;
            line-height: 1.4;
        }

    </style>

</head>


<body>

         HEADER
