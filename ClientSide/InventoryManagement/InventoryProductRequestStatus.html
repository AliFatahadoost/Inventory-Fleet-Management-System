<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Request Status</title>

    <!-- Jali -->
    <script
        type="module"
        src="http://127.0.0.1:8080/coreJs">
    </script>

    <style>

        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;

            font-family:
                'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background-color: var(--background);
            color: var(--text);
        }

        .page-header { margin-bottom: 25px; }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container { width: 100%; overflow-x: auto; }

    </style>

</head>


<body>

    <div class="page-header">

        <h1>
            Product Request Status
        </h1>

        <p>
            Manage product request statuses (pending, approved, in-transit, …).
        </p>

    </div>


    <div class="table-container">

        <fetch-data-table

            data-AccessCode="109"

            api="http://127.0.0.1:8080/inventoryProductRequestStatusApi"

            table-id="inventoryProductRequestStatusTable"

            caption="Product Request Statuses"

            classes="blue neon pastel dark"

            inputs="
                |name::request_status_code|title::Status Code|type::number|value::;;
                |name::request_status_title|title::Status Title|type::text|value::;;
            "

            columns="
                Status Code,
                Status Title
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
