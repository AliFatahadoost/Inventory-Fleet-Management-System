
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory Type</title>

    <!-- Jali -->
    <script
        type="module"
        src="http://127.0.0.1:8080/coreJs">
    </script>

    <style>

        :root {
            --background: #f8fafc;
            --card-background: #ffffff;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding: 25px;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color:
                var(--background);

            color:
                var(--text);
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 8px 0;

            font-size: 2rem;

            font-weight: 600;
        }

        .page-header p {
            margin: 0;

            color:
                var(--secondary-text);

            font-size: 0.95rem;
        }

        .table-container {
            width: 100%;

            overflow-x: auto;
        }

    </style>

</head>


<body>

    <!-- =====================================================
         PAGE HEADER
         ===================================================== -->

    <div class="page-header">

        <h1>
            Inventory Type
        </h1>

        <p>
            Manage inventory type definitions.
        </p>

    </div>


    <!-- =====================================================
         INVENTORY TYPE TABLE
         ===================================================== -->

    <div class="table-container">

        <fetch-data-table
            data-AccessCode="100"
            api="http://127.0.0.1:8080/inventoryTypeApi"
            table-id="inventoryTypeTable"
            caption="Inventory Types"
            classes="blue neon pastel dark"

            inputs="
                |name::inventory_type_title|title::Inventory Type Title|type::text|value::;;
                |name::inventory_type_code|title::Inventory Type Code|type::number|value::;;
            "

            columns="
                Inventory Type,
                Code assigned to that Type
            "
        >
        </fetch-data-table>

    </div>


    <script>

        /*
         * The fetch-data-table component handles:
         *
         * GET    → loading data
         * POST   → creating data
         * PUT    → updating data
         * DELETE → deleting data
         *
         * The API endpoint is:
         *
         * http://127.0.0.1:8080/inventoryTypeApi
         *
         * Object code:
         *
         * 100 = InventoryType
         */

    </script>

</body>

</html>
