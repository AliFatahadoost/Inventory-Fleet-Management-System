<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product</title>

    <!-- Jali -->
    <script
        type="module"
        src="http://127.0.0.1:8080/coreJs">
    </script>

    <style>

        :root {
            --background: #f8fafc;
            --text: #1e293b;
            --secondary-text: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: var(--background);
            color: var(--text);
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.95rem;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

    </style>

</head>


<body>

    <!-- =====================================================
         PAGE HEADER
         ===================================================== -->

    <div class="page-header">

        <h1>
            Product
        </h1>

        <p>
            Manage products and their product codes.
        </p>

    </div>


    <!-- =====================================================
         PRODUCT TABLE
         Object Code: 104
         ===================================================== -->

    <div class="table-container">

        <fetch-data-table

            data-AccessCode="104"

            api="http://127.0.0.1:8080/productApi"

            table-id="productTable"

            caption="Products"

            classes="blue neon pastel dark"

            inputs="
                |name::product_code|title::Product Code|type::number|value::;;
                |name::product_title|title::Product Title|type::text|value::;;
            "

            columns="
                Product Code,
                Product Title
            "

        >
        </fetch-data-table>

    </div>

</body>

</html>
