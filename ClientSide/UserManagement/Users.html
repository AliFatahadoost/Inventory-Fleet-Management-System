<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <script type="module" src="http://127.0.0.1:8080/coreJs"></script>
    <style>
        :root { --background: #f8fafc; --text: #1e293b; --secondary-text: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background); color: var(--text);
        }
        .page-header { margin-bottom: 25px; }
        .page-header h1 { margin: 0 0 8px 0; font-size: 2rem; font-weight: 600; }
        .page-header p { margin: 0; color: var(--secondary-text); font-size: 0.95rem; }

        .create-form {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 22px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            align-items: end;
        }
        .create-form label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .create-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .create-form input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .create-form button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .create-form button:hover { background: #1d4ed8; }

        .table-container { width: 100%; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Users</h1>
        <p>Create and view system users.</p>
    </div>

    <div class="create-form">
        <div>
            <label>Username</label>
            <input id="newUsername" type="text" placeholder="e.g. jdoe">
        </div>
        <div>
            <label>Password</label>
            <input id="newPassword" type="password">
        </div>
        <div>
            <label>User Code</label>
            <input id="newUserCode" type="number" placeholder="e.g. 2">
        </div>
        <div>
            <button id="createBtn">Create User</button>
        </div>
    </div>

    <div class="table-container">
        <fetch-data-table
            readonly
            data-AccessCode="41"
            api="http://127.0.0.1:8080/usersListApi"
            table-id="usersTable"
            caption="Users"
            classes="blue neon pastel dark"
            columns="Code,Username"
        >
        </fetch-data-table>
    </div>

    <script>
        document.getElementById("createBtn").addEventListener("click", async () => {
            const username = document.getElementById("newUsername").value.trim();
            const password = document.getElementById("newPassword").value;
            const userCode = document.getElementById("newUserCode").value.trim();

            if (!username || !password || !userCode) {
                alert("All fields required.");
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8080/createUserApi", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        input0: username,
                        input1: password,
                        input2: userCode
                    })
                });
                if (!response.ok) throw new Error("HTTP " + response.status);

                document.getElementById("newUsername").value = "";
                document.getElementById("newPassword").value = "";
                document.getElementById("newUserCode").value = "";

                // Refresh the table
                const table = document.querySelector("fetch-data-table");
                const tb = table.shadowRoot.getElementById("tbody_usersTable");
                const r = await fetch("http://127.0.0.1:8080/usersListApi?pageRowCount=50&whichPage=1&dataSent0&dataSent1");
                const data = await r.json();

                tb.innerHTML = data.map((u, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${u.SYS_USER_CODE ?? ""}</td>
                        <td>${u.SYS_USERNAME ?? ""}</td>
                    </tr>
                `).join("");

            } catch (e) {
                console.error("Create user failed:", e);
                alert("Failed: " + e.message);
            }
        });
    </script>
</body>
</html>
